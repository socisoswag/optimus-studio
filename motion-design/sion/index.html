<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Chronologie Israël · Palestine — motion design</title>
<meta name="robots" content="noindex">
<style>
  @font-face { font-family: 'Archivo'; src: url('fonts/Archivo[wdth,wght].ttf') format('truetype'); font-weight: 100 900; font-stretch: 62% 125%; }
  @font-face { font-family: 'Newsreader'; src: url('fonts/Newsreader-Italic[opsz,wght].ttf') format('truetype'); font-style: italic; font-weight: 200 800; }
  @font-face { font-family: 'Newsreader'; src: url('fonts/Newsreader[opsz,wght].ttf') format('truetype'); font-style: normal; font-weight: 200 800; }
  @font-face { font-family: 'DM Mono'; src: url('fonts/DMMono-Light.ttf') format('truetype'); font-weight: 300; }
  @font-face { font-family: 'DM Mono'; src: url('fonts/DMMono-Regular.ttf') format('truetype'); font-weight: 400; }
  @font-face { font-family: 'DM Mono'; src: url('fonts/DMMono-Medium.ttf') format('truetype'); font-weight: 500; }
  @font-face { font-family: 'Noto Sans Hebrew'; src: url('fonts/NotoSansHebrew[wdth,wght].ttf') format('truetype'); font-weight: 100 900; font-stretch: 62.5% 100%; }
  @font-face { font-family: 'Noto Kufi Arabic'; src: url('fonts/NotoKufiArabic[wght].ttf') format('truetype'); font-weight: 100 900; }

  :root {
    --ink: #0d0c0a;        /* nuit de cendre */
    --smoke: #2a2620;      /* fumée */
    --stone: #e9dcc0;      /* pierre de Jérusalem */
    --ash: #9a8f7e;        /* cendre */
    --ember: #ff5b1f;      /* braise */
    --hot: #ffae5a;        /* braise vive */
    --map: #7f989a;        /* encre d'état-major */
    --display: 'Archivo', sans-serif;
    --serif: 'Newsreader', serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ink); }
  body { position: relative; color: var(--stone); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
  canvas, .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
  #world { position: absolute; inset: 0; }
  #map { mix-blend-mode: screen; }
  #grain { mix-blend-mode: overlay; opacity: .3; }
  #vignette { background: radial-gradient(ellipse 72% 70% at 50% 48%, rgba(0,0,0,0) 52%, rgba(0,0,0,.42) 80%, rgba(0,0,0,.82) 100%); }
  #flicker { background: #000; opacity: 0; }
  #flash { mix-blend-mode: screen; opacity: 0; background: radial-gradient(ellipse 80% 75% at var(--fx, 50%) var(--fy, 50%), rgba(255,236,206,1) 0%, rgba(255,150,80,.55) 45%, rgba(255,91,31,0) 80%); }
  #fade { background: #000; opacity: 1; }

  /* ---------- typographie ---------- */
  .seg { position: absolute; inset: 0; display: none; will-change: transform; }
  .scrim { position: absolute; inset: 0; pointer-events: none; }
  .L .scrim { background: linear-gradient(90deg, rgba(9,8,7,.86) 0%, rgba(9,8,7,.6) 36%, rgba(9,8,7,0) 62%); }
  .R .scrim { background: linear-gradient(270deg, rgba(9,8,7,.86) 0%, rgba(9,8,7,.6) 36%, rgba(9,8,7,0) 62%); }
  .pair .scrim, .event .scrim, .outro .scrim, .intro .scrim { background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(9,8,7,.62) 0%, rgba(9,8,7,.25) 60%, rgba(9,8,7,0) 100%); }

  .ghost { position: absolute; top: 40px; font-family: var(--display); font-variation-settings: 'wdth' 62, 'wght' 760; font-size: 640px; line-height: 1; letter-spacing: -.02em; color: transparent; -webkit-text-stroke: 2px rgba(233,220,192,.16); white-space: nowrap; }
  .L .ghost { left: 70px; }
  .R .ghost { right: 70px; }
  .pair .ghost, .event .ghost { left: 50%; transform: translateX(-50%); }

  .block { position: absolute; top: 236px; width: 940px; transform-origin: 0 50%; }
  .L .block { left: 132px; }
  .R .block { right: 132px; text-align: right; transform-origin: 100% 50%; }

  .eyebrow { display: flex; align-items: center; gap: 18px; font-family: var(--mono); font-weight: 400; font-size: 19px; letter-spacing: .24em; text-transform: uppercase; color: var(--hot); height: 28px; white-space: nowrap; }
  .R .eyebrow { justify-content: flex-end; }
  .eyebrow .tick { display: block; width: 56px; height: 2px; background: var(--ember); transform-origin: 0 50%; flex: none; }
  .R .eyebrow .tick { order: 2; transform-origin: 100% 50%; }
  .eyebrow .cur { display: inline-block; width: .6em; height: 1em; background: var(--ember); vertical-align: -.12em; margin-left: .1em; }

  .name { margin-top: 26px; font-family: var(--display); font-variation-settings: 'wdth' 62, 'wght' 860; font-size: 178px; line-height: .86; text-transform: uppercase; letter-spacing: -.005em; color: var(--stone); white-space: nowrap; }
  .name .ln { overflow: hidden; padding: .16em .04em .02em; margin: -.16em -.04em -.02em; }
  .name .ln + .ln { margin-top: -.06em; }
  .name .ch { display: inline-block; will-change: transform; }
  .name .ln.l2 { color: var(--stone); }
  .name .ln.l1 { font-variation-settings: 'wdth' 62, 'wght' 300; color: rgba(233,220,192,.92); }

  .native { margin-top: 22px; font-size: 50px; line-height: 1.35; color: var(--ash); display: inline-block; white-space: nowrap; }
  .native[lang="he"] { font-family: 'Noto Sans Hebrew'; font-weight: 600; font-stretch: 80%; font-size: 54px; }
  .native[lang="ar"] { font-family: 'Noto Kufi Arabic'; font-weight: 600; font-size: 44px; line-height: 1.6; }
  .nativeWrap { display: block; }

  .rule { margin-top: 20px; width: 132px; height: 3px; background: linear-gradient(90deg, var(--ember), var(--hot)); transform-origin: 0 50%; box-shadow: 0 0 18px rgba(255,91,31,.7); }
  .R .rule { margin-left: auto; transform-origin: 100% 50%; background: linear-gradient(270deg, var(--ember), var(--hot)); }

  .text { margin-top: 26px; max-width: 850px; font-family: var(--serif); font-style: italic; font-variation-settings: 'opsz' 36; font-weight: 400; font-size: 38px; line-height: 1.24; color: rgba(233,220,192,.94); }
  .R .text { margin-left: auto; }
  .text .w { display: inline-block; white-space: pre; will-change: transform, opacity; }

  .meta { margin-top: 28px; font-family: var(--mono); font-size: 18px; letter-spacing: .2em; text-transform: uppercase; color: var(--ash); display: flex; gap: 18px; align-items: center; }
  .R .meta { justify-content: flex-end; }
  .meta .dot { width: 6px; height: 6px; background: var(--ember); border-radius: 50%; box-shadow: 0 0 10px var(--ember); }

  /* portrait d'archive (facultatif) */
  .portrait { position: absolute; top: 170px; width: 500px; height: 640px; overflow: hidden; background: #111; }
  .L .portrait { right: 150px; }
  .R .portrait { left: 150px; }
  .portrait .ph { position: absolute; inset: -4%; background-size: cover; background-position: 50% 30%; filter: grayscale(1) contrast(1.3) brightness(.8) sepia(.3); }
  .portrait .tint { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,91,31,0) 40%, rgba(255,91,31,.35) 100%); mix-blend-mode: soft-light; }
  .portrait .dots { position: absolute; inset: 0; background-image: radial-gradient(rgba(0,0,0,.55) 1px, transparent 1.6px); background-size: 5px 5px; mix-blend-mode: multiply; opacity: .55; }
  .portrait .frame { position: absolute; inset: 0; border: 1px solid rgba(233,220,192,.35); box-shadow: inset 0 0 140px rgba(0,0,0,.75); background: linear-gradient(180deg, rgba(9,8,7,0) 70%, rgba(9,8,7,.75) 100%); }
  .portrait .cap { position: absolute; left: 18px; bottom: 16px; font-family: var(--mono); font-size: 14px; letter-spacing: .24em; color: var(--stone); text-transform: uppercase; }

  /* personnage détouré */
  .cutout { position: absolute; bottom: 0; width: 900px; height: 1010px; transform-origin: 50% 100%; }
  .L .cutout { right: 30px; }
  .R .cutout { left: 30px; }
  .cutout .cimg, .cutout .cdots { position: absolute; inset: 0; }
  .cutout .cimg { background-size: contain; background-repeat: no-repeat; background-position: 50% 100%;
    -webkit-mask-image: linear-gradient(to top, transparent 0, #000 16%); mask-image: linear-gradient(to top, transparent 0, #000 16%); }
  .cutout .cdots { background-image: radial-gradient(rgba(0,0,0,.6) 1px, transparent 1.7px); background-size: 5px 5px;
    -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-position: 50% 100%; mask-position: 50% 100%; mix-blend-mode: multiply; opacity: .45; }

  /* paire */
  .pair .side { position: absolute; top: 300px; width: 760px; }
  .pairbg { position: absolute; top: 0; bottom: 0; width: 56%; overflow: hidden; opacity: 0; }
  .pairbg.a { left: 0; -webkit-mask-image: linear-gradient(90deg, #000 25%, transparent 100%); mask-image: linear-gradient(90deg, #000 25%, transparent 100%); }
  .pairbg.b { right: 0; -webkit-mask-image: linear-gradient(270deg, #000 25%, transparent 100%); mask-image: linear-gradient(270deg, #000 25%, transparent 100%); }
  .pairbg .ph { position: absolute; inset: 0; background-size: cover; background-position: 50% 25%; filter: grayscale(1) contrast(1.25) brightness(.55) sepia(.35); }
  .pairbg.cutp { -webkit-mask-image: linear-gradient(to top, transparent 0, #000 18%); mask-image: linear-gradient(to top, transparent 0, #000 18%); width: 48%; }
  .pairbg.cutp .ph { background-size: contain; background-repeat: no-repeat; background-position: 50% 100%; filter: grayscale(1) contrast(1.2) brightness(.6) sepia(.3) drop-shadow(0 0 1.5px rgba(255,196,128,.8)) drop-shadow(0 0 26px rgba(255,91,31,.45)); }
  .pair .side.a { left: 120px; }
  .pair .side.b { right: 120px; text-align: right; }
  .pair .name { font-size: 150px; margin-top: 0; }
  .pair .side.b .meta { justify-content: flex-end; }
  .pair .amp { position: absolute; left: 50%; top: 300px; transform: translateX(-50%); font-family: var(--serif); font-style: italic; font-weight: 300; font-variation-settings: 'opsz' 72; font-size: 230px; line-height: 1; color: var(--ember); text-shadow: 0 0 40px rgba(255,91,31,.55); }
  .pair .top { position: absolute; top: 150px; left: 0; right: 0; text-align: center; }
  .pair .top .eyebrow, .split .footer .eyebrow, .center .eyebrow { justify-content: center; }
  .pair .bottom { position: absolute; top: 742px; left: 360px; right: 360px; text-align: center; }
  .pair .bottom .text { max-width: none; font-size: 36px; margin: 0 auto; }

  /* 1948 */
  .split .half { position: absolute; top: 210px; width: 820px; }
  .split .half.a { left: 110px; }
  .split .half.b { right: 110px; text-align: right; }
  .split .kicker { font-family: var(--mono); font-size: 19px; letter-spacing: .24em; text-transform: uppercase; color: var(--hot); }
  .split .word { margin-top: 18px; font-family: var(--display); font-variation-settings: 'wdth' 62, 'wght' 860; font-size: 146px; line-height: .86; text-transform: uppercase; overflow: hidden; padding-top: .16em; margin-top: calc(18px - .16em); white-space: nowrap; }
  .split .word .ch { display: inline-block; }
  .split .text { font-size: 36px; max-width: 700px; }
  .split .half.b .text { margin-left: auto; }
  .split .seam { position: absolute; left: 959px; top: 150px; width: 2px; height: 700px; background: linear-gradient(180deg, rgba(255,91,31,0), var(--ember) 20%, var(--hot) 50%, var(--ember) 80%, rgba(255,91,31,0)); box-shadow: 0 0 22px rgba(255,91,31,.8); transform-origin: 50% 0; }
  .split .footer { position: absolute; top: 790px; left: 0; right: 0; text-align: center; }
  .split .scrimL { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(9,8,7,.82) 0%, rgba(9,8,7,.5) 40%, rgba(9,8,7,.12) 50%, rgba(9,8,7,.5) 60%, rgba(9,8,7,.82) 100%); }

  /* centre : intro, 1995, fin */
  .center .wrap { position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; transform-origin: 50% 50%; }
  .center .big { font-family: var(--display); font-variation-settings: 'wdth' 62, 'wght' 860; font-size: 236px; line-height: .86; text-transform: uppercase; overflow: hidden; padding: .16em .05em .02em; white-space: nowrap; }
  .center .big .ch { display: inline-block; }
  .center .big.thin { font-variation-settings: 'wdth' 62, 'wght' 260; }
  .center .bar { width: 520px; height: 3px; margin: 26px 0 20px; background: linear-gradient(90deg, rgba(255,91,31,0), var(--ember) 25%, var(--hot) 50%, var(--ember) 75%, rgba(255,91,31,0)); box-shadow: 0 0 24px rgba(255,91,31,.75); }
  .center .text { max-width: 1100px; margin-left: auto; margin-right: auto; font-size: 42px; }
  .center .eyebrow { margin-bottom: 30px; }
  .event .big { font-size: 210px; }
  .outro .big { font-size: 190px; }

  /* générique : mots-chocs */
  .beat .wrap { justify-content: flex-start; padding-top: 214px; }
  .beat .big { font-size: 300px; }
  .beat .text { max-width: 1640px; margin-top: 26px; font-size: 40px; white-space: nowrap; }
  .beat .ghost, .title .ghost { left: 50%; transform: translateX(-50%); top: 60px; }

  /* titre du film */
  .title .big.sion { font-size: 430px; letter-spacing: .09em; padding-left: .14em; }
  .title .scripts { display: flex; align-items: center; justify-content: center; gap: 46px; margin-top: 4px; }
  .title .scripts .native { margin: 0; color: rgba(233,220,192,.9); }
  .title .scripts .native[lang="he"] { font-size: 76px; }
  .title .scripts .native[lang="ar"] { font-size: 62px; }
  .title .scripts .bar { display: block; width: 300px; margin: 0; transform-origin: 50% 50%; }
  .title .text { margin-top: 34px; font-size: 54px; }

  /* crédit */
  .credit .by { font-size: 42px; color: rgba(233,220,192,.78); margin-bottom: 6px; }
  .credit .big { font-size: 176px; letter-spacing: .015em; }
  .credit .big .f .ch { font-variation-settings: 'wdth' 62, 'wght' 260; }
  .credit .role { margin-top: 30px; justify-content: center; }

  /* ouverture de partie */
  .part .ghost { left: 30px; top: -170px; font-family: var(--serif); font-style: normal; font-variation-settings: 'opsz' 72, 'wght' 300; font-size: 1200px; letter-spacing: -.02em; -webkit-text-stroke: 2px rgba(233,220,192,.13); }
  .part .block { top: 150px; width: 980px; }
  .part .name { font-size: 236px; margin-top: 20px; }
  .part .psub { margin-top: 14px; font-family: var(--serif); font-style: italic; font-variation-settings: 'opsz' 60; font-size: 54px; line-height: 1.1; color: var(--stone); }
  .part .psub .w { display: inline-block; white-space: pre; }
  .part .rule { margin-top: 30px; }
  .part .chap { list-style: none; margin-top: 30px; }
  .part .chap li { display: flex; gap: 22px; align-items: baseline; font-family: var(--serif); font-variation-settings: 'opsz' 24; font-size: 29px; line-height: 1.3; padding-block: 5px; will-change: transform, opacity; }
  .part .chap .t { max-width: 860px; text-wrap: pretty; }
  .part .chap .n { flex: none; width: 40px; font-family: var(--mono); font-size: 17px; letter-spacing: .18em; color: var(--ember); }

  /* cartons de chapitre */
  .chapter .scrim { background: radial-gradient(ellipse 80% 70% at var(--sx, 30%) 55%, rgba(9,8,7,.78) 0%, rgba(9,8,7,.42) 55%, rgba(9,8,7,0) 100%); }
  .c-R .scrim { --sx: 70%; }
  .c-C .scrim { --sx: 50%; }
  .chapter .ghost { top: 120px; font-size: 760px; }
  .c-L .ghost { left: 60px; }
  .c-R .ghost { right: 60px; }
  .c-C .ghost { left: 50%; transform: translateX(-50%); }
  .chapter .block { position: absolute; top: 330px; width: 1160px; transform-origin: 0 50%; }
  .c-L .block { left: 132px; }
  .c-R .block { right: 132px; text-align: right; transform-origin: 100% 50%; }
  .c-R .eyebrow { justify-content: flex-end; }
  .c-R .eyebrow .tick { order: 2; transform-origin: 100% 50%; }
  .c-C .block { left: 50%; margin-left: -800px; width: 1600px; text-align: center; transform-origin: 50% 50%; top: 250px; }
  .c-C .eyebrow { justify-content: center; }
  .ctrow { margin-top: 24px; }
  .ctwrap { position: relative; display: inline-block; max-width: 100%; }
  .ctitle { position: relative; font-family: var(--display); font-variation-settings: 'wdth' 62, 'wght' 860; font-size: 160px; line-height: .92; text-transform: uppercase; color: var(--stone); text-wrap: balance; }
  .ctitle .wd { display: inline-block; white-space: nowrap; overflow: hidden; padding: .16em .03em .02em; margin: -.16em -.03em -.02em; vertical-align: top; }
  .ctitle .ch { display: inline-block; }
  .ctwrap .wipebar { position: absolute; left: 0; top: -4%; width: 3px; height: 108%; background: var(--hot); box-shadow: 0 0 22px 4px rgba(255,91,31,.85); opacity: 0; }
  .chapter .csub { margin-top: 24px; font-size: 46px; max-width: 1100px; }
  .c-R .csub { margin-left: auto; }
  .c-C .csub { margin-left: auto; margin-right: auto; }

  /* passages surlignés [[ … ]] */
  .text .w.hl { background-image: linear-gradient(90deg, var(--ember), var(--hot)); background-repeat: no-repeat; background-position: 0 96%; background-size: 0% .09em; }

  /* document cité (résolutions, lettres, accords) */
  .doc .ghost { top: 60px; }
  .doc .block { top: 132px; width: 1000px; }
  .doc .name { font-size: 150px; margin-top: 22px; }
  .doc .meta { margin-top: 22px; font-size: 17px; }
  .R.doc .meta { justify-content: flex-end; }
  .doc .rule { margin-top: 24px; }
  .doc .dq { position: relative; margin-top: 30px; }
  .doc .dq .qm { position: absolute; left: -86px; top: -38px; font-family: var(--serif); font-style: italic; font-weight: 300; font-variation-settings: 'opsz' 72; font-size: 170px; line-height: 1; color: var(--ember); text-shadow: 0 0 34px rgba(255,91,31,.55); }
  .doc .dq .text { margin-top: 0; max-width: 980px; font-size: 39px; line-height: 1.27; }
  .doc .dq .text + .text { margin-top: 18px; }
  .R.doc .dq .text { margin-left: auto; text-align: left; }
  .doc .dref { margin-top: 22px; font-family: var(--mono); font-size: 16px; letter-spacing: .22em; text-transform: uppercase; color: var(--ash); }
  .doc .dnote { margin-top: 20px; font-size: 31px; color: rgba(233,220,192,.78); max-width: 940px; }
  .doc .drows { margin-top: 30px; display: flex; flex-direction: column; gap: 16px; }
  .doc .drow { display: flex; gap: 22px; align-items: baseline; }
  .R.doc .drow { flex-direction: row-reverse; }
  .doc .dl { flex: none; min-width: 210px; padding: 5px 12px 4px; font-family: var(--mono); font-weight: 500; font-size: 17px; letter-spacing: .2em; text-transform: uppercase; color: #120f0c; background: var(--ember); text-align: center; }
  .doc .dt { font-family: var(--serif); font-variation-settings: 'opsz' 24; font-size: 31px; line-height: 1.25; color: rgba(233,220,192,.94); }

  /* chiffre-choc */
  .stat .ghost { top: 60px; }
  .stat .block { top: 200px; width: 1000px; }
  .stat .name { font-size: 250px; margin-top: 18px; }
  .stat .name .ln.l1 { font-size: .4em; line-height: 1; padding-bottom: 0; }
  .stat .name .stn { display: block; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat .gs { display: inline-block; width: .14em; }
  .stat .stlab { margin-top: 10px; font-family: var(--display); font-variation-settings: 'wdth' 62, 'wght' 380; font-size: 66px; line-height: .98; text-transform: uppercase; color: var(--stone); max-width: 980px; }
  .R.stat .stlab { margin-left: auto; }
  .stat .text { font-size: 36px; }
  .stat.B .scrim { background: linear-gradient(0deg, rgba(9,8,7,.9) 0%, rgba(9,8,7,.62) 32%, rgba(9,8,7,0) 58%); }
  .stat.B .block { top: auto; bottom: 96px; left: 132px; width: 1656px; }
  .stat.B .name { display: flex; align-items: baseline; gap: 30px; font-size: 176px; margin-top: 8px; }
  .stat.B .name .ln.l1 { font-size: .42em; }
  .stat.B .stlab { font-size: 52px; max-width: none; }
  .stat.B .text { max-width: 1500px; margin-top: 16px; font-size: 34px; }
  .stat.B .meta { margin-top: 18px; }

  /* citation */
  .quote .scrim { background: radial-gradient(ellipse 80% 64% at 50% 60%, rgba(9,8,7,.8) 0%, rgba(9,8,7,.45) 60%, rgba(9,8,7,0) 100%); }
  .quote .wrap { padding: 0 220px; }
  .quote .qm { display: block; height: 130px; font-family: var(--serif); font-style: italic; font-weight: 300; font-variation-settings: 'opsz' 72; font-size: 230px; line-height: 1; color: var(--ember); text-shadow: 0 0 40px rgba(255,91,31,.6); }
  .quote .text.qt { max-width: 1420px; margin-top: 10px; font-size: 70px; line-height: 1.14; font-variation-settings: 'opsz' 72; text-wrap: balance; }
  .quote .eyebrow.qa { margin: 40px 0 0; }
  .quote.pos-low .wrap { justify-content: flex-end; padding-bottom: 150px; }
  .quote.pos-low .scrim { background: linear-gradient(0deg, rgba(9,8,7,.92) 0%, rgba(9,8,7,.7) 40%, rgba(9,8,7,0) 72%); }

  /* HUD */
  .hud-tl, .hud-tr { position: absolute; top: 58px; font-family: var(--mono); font-size: 15px; letter-spacing: .3em; text-transform: uppercase; line-height: 1.7; }
  .hud-tl { left: 132px; color: rgba(233,220,192,.78); }
  .hud-tl b { font-weight: 500; color: var(--stone); }
  .hud-tl span { color: var(--ash); }
  .hud-tr { right: 132px; text-align: right; color: var(--ash); }
  .hud-tr .idx { color: var(--stone); font-weight: 500; }
  .hud-tr .idx em { font-style: normal; color: var(--hot); }
