titre: "Conclusion"
intro: >-
  Le film dit sa position, une seule fois et clairement : l'égalité des droits, entre la mer et le Jourdain. Puis il
  laisse la dernière image à la terre. Pas de discours, pas de musique : la voix se fait rare, le son de la ville monte.
chapitres:
  - num: "C.0"
    titre: "Ouverture de la conclusion"
    plans:
      - type: MD
        fichier: output/conclusion.mp4
        entree: 0
        sortie: 14
        ecran: "Conclusion"

  - num: "37"
    titre: "Chapitre 37 · Le droit des peuples à disposer d'eux-mêmes"
    intention: >-
      Le principe, sa source (la Charte de l'ONU) et son rappel par la Cour en 2024. Le film le défend : c'est sa
      position, dite comme telle.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-37.mp4
        entree: 0
        sortie: 4.6
      - type: ARCH
        fichier: output/archives-filmees/1945-san-francisco-charte-onu.mp4
        carton: output/cartons/53-arch-1945-san-francisco-charte-onu.mov
        entree: 0
        sortie: 11.48
        ecran: "carton : 26 juin 1945 · San Francisco · Cinquante pays signent la Charte des Nations unies"
        source: "actualités Universal « San Francisco Parley Ends », 28 juin 1945, archive.org 1945-06-28_San_Francisco_Parley_Ends ; Charte des Nations unies, 26 juin 1945, article 1, paragraphe 2 ; CIJ, avis du 19 juillet 2024 (droit du peuple palestinien à l'autodétermination)"
        voix: >-
          En 1945, la Charte des Nations unies pose un principe : / le droit des peuples à disposer d'eux-mêmes. // En
          2024, la Cour internationale de justice le rappelle pour le peuple **palestinien**.
      - type: RÉEL
        fichier: output/plans-reels/jerusalem-porte-de-damas-aerien-2022.mp4
        entree: 14
        sortie: 24
        source: "SOURCES.md 4.1, Adobe Stock 508320837 (autre passage que celui du chapitre 19)"
        voix: >-
          Ce droit, le sionisme l'a revendiqué pour les Juifs. / On ne peut pas le refuser aux **Palestiniens**.

  - num: "38"
    titre: "Chapitre 38 · La souffrance palestinienne : entre mémoire, poésie et lumière"
    intention: >-
      Darwich, puis un mot palestinien (sumud), puis les familles endeuillées des deux peuples qui se parlent : la
      douleur n'a pas de camp.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-38.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 267
        sortie: 277
        voix: >-
          Mahmoud Darwich naît en 1941 à al-Birwa, en Galilée. / Le village est vidé en 1948, puis **rasé**.
      - type: MD
        fichier: output/citation-darwich.mp4
        entree: 0
        sortie: 13
        source: "SOURCES.md 6 (Mahmoud Darwich, « Sur cette terre »)"
        voix: >-
          « Sur cette terre, / il y a ce qui mérite la **vie**. » ///
      - type: RÉEL
        fichier: output/plans-reels/olivier-mains-sur-le-tronc.mp4
        entree: 0
        sortie: 9
        source: "SOURCES.md 4.1, Adobe Stock 547188073 (des mains sur le tronc d'un olivier ; lieu non précisé)"
        voix: >-
          Les Palestiniens ont un mot pour cela : / sumud. / Tenir. / **Rester**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 202
        sortie: 215
        ecran: "fiche : Jérusalem 1935 · New York 2003 · Edward Said"
        source: "Edward Said, The Question of Palestine, 1979 (La Question de Palestine)"
        voix: >-
          Edward Said naît à Jérusalem en 1935. / Exilé, il devient à New York l'une des grandes voix du monde. / En 1979, il publie « La Question de **Palestine** ».
      - type: MD
        fichier: output/documents-6.mp4
        entree: 497
        sortie: 511
        ecran: "fiche : Gaza · 2023 et 2025 · Les chrétiens de Palestine"
        source: "patriarcat grec-orthodoxe de Jérusalem, 22 octobre 2023 (au moins 18 morts à Saint-Porphyre) ; patriarcat latin de Jérusalem, 17 juillet 2025, et communiqué commun des Églises du 18 juillet (3 morts, 10 blessés)"
        voix: >-
          Edward Said venait d'une famille chrétienne, comme une partie des Palestiniens, de Bethléem à Nazareth. / En octobre 2023, une frappe israélienne touche l'église Saint-Porphyre, à Gaza, où s'abritent des familles : au moins dix-huit morts. / En juillet 2025, l'église de la Sainte-Famille, seule paroisse catholique de Gaza : trois **morts**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 322
        sortie: 336
        ecran: "fiche : Beyrouth 1972 · Londres 1987 · Kanafani et Handala"
        source: "Ghassan Kanafani, tué à Beyrouth le 8 juillet 1972 ; Naji al-Ali, blessé par balle à Londres en juillet 1987, mort le 29 août 1987"
        voix: >-
          La Palestine a ses voix : / l'écrivain Ghassan Kanafani, tué dans un attentat à Beyrouth en 1972 ; / le dessinateur Naji al-Ali, père de Handala, l'enfant qui tourne le dos, tué à Londres en **1987**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 336
        sortie: 348
        ecran: "fiche : Masafer Yatta · Oscar, 2 mars 2025 · No Other Land"
        source: "No Other Land (Basel Adra, Hamdan Ballal, Yuval Abraham, Rachel Szor), Oscar du meilleur documentaire, 2 mars 2025"
        voix: >-
          En 2025, « No Other Land », tourné à Masafer Yatta par des Palestiniens et des Israéliens, / reçoit l'Oscar du meilleur **documentaire**.
      - type: MD
        fichier: output/documents-3.mp4
        entree: 144
        sortie: 159
        ecran: "déjà dans le plan : fiche sur la carte (date, lieu, faits) ; pas d'IA pour un événement récent"
        source: "Parents Circle-Families Forum, fondé en 1995"
        voix: >-
          Depuis 1995, des familles israéliennes et palestiniennes qui ont perdu un enfant se réunissent : / le Cercle des
          parents. // Elles disent : nous ne voulons plus de nouveaux **membres**.

  - num: "39"
    titre: "Chapitre 39 · Pour une paix juste : aimer la terre, pas la détruire"
    intention: >-
      La position du film, en une phrase. Puis la terre, et la ville, sans voix.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-39.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/chronologie.mp4
        entree: 73
        sortie: 79.6
        ecran: "fiche de fin : De 1897 à 1995 · Un siècle. Deux peuples. Une terre."
      - type: NOIR
        duree: 15
        voix: >-
          Ce film a pris position : / pour l'égalité des droits, entre la mer et le Jourdain. / Il ne demande à personne
          de partir. / Il demande que personne ne soit plus **chassé**.
      - type: RÉEL
        fichier: output/plans-reels/jerusalem-dome-du-rocher-couchant-nuit-2023.mp4
        entree: 0
        sortie: 10
        source: "SOURCES.md 4.1, Adobe Stock 609005799"
        voix: >-
          Aimer cette terre, / sans la **détruire**. ///
        son: "la ville le soir, un appel lointain, des cloches, puis le silence"
      - type: MD
        fichier: output/generique-fin.mp4
        duree: 60
        note: "générique de fin : à finaliser à la toute fin (crédits CC BY et CC BY-SA, voir SOURCES.md 1)"
