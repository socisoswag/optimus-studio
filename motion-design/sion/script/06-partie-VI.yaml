titre: "Partie VI · Voix et contre-voix"
intro: >-
  Ceux qui disent non de l'intérieur : des Juifs antisionistes, des religieux, des Israéliens. Puis le débat français,
  par les mots exacts de ses deux figures les plus présentes. Règle 7 : personnes vivantes, seulement leurs propres
  mots, datés, sourcés et non tronqués.
chapitres:
  - num: "VI.0"
    titre: "Ouverture de la partie VI"
    plans:
      - type: MD
        fichier: output/partie-6.mp4
        entree: 0
        sortie: 14.4
        ecran: "Partie VI · Voix et contre-voix"

  - num: "29"
    titre: "Chapitre 29 · Les Juifs antisionistes : Neturei Karta, Jewish Voice for Peace"
    intention: >-
      Deux refus très différents : au nom de la foi, au nom de l'égalité. Puis les Israéliens qui témoignent ou
      refusent de servir. Finir en rappelant que ces voix sont minoritaires : c'est vrai, et le dire les rend plus
      crédibles.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-29.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/documents-3.mp4
        entree: 53
        sortie: 69
        ecran: "déjà dans le plan : fiche sur la carte (date, lieu, faits) ; pas d'IA pour un événement récent"
        source: "Neturei Karta, fondé à Jérusalem en 1938"
        voix: >-
          Il existe des Juifs qui refusent le sionisme au nom de leur foi. / Les Neturei Karta, « les gardiens de la
          cité », fondés à Jérusalem en 1938, / pour qui un État juif avant le Messie est une **faute**.
      - type: MD
        fichier: output/documents-3.mp4
        entree: 69
        sortie: 82
        ecran: "déjà dans le plan : fiche sur la carte (date, lieu, faits) ; pas d'IA pour un événement récent"
        source: "Jewish Voice for Peace, fondé en septembre 1996 à Berkeley ; plus de 32 000 membres cotisants en 2024"
        voix: >-
          D'autres le refusent au nom de l'égalité. / Aux États-Unis, Jewish Voice for Peace, fondé en 1996, /
          revendique plus de trente mille **membres**.
      - type: MD
        fichier: output/documents-3.mp4
        entree: 82
        sortie: 95
        ecran: "déjà dans le plan : fiche sur la carte (date, lieu, faits) ; pas d'IA pour un événement récent"
        source: "sit-in du 18 octobre 2023 dans un bâtiment du Congrès à Washington ; gare de Grand Central, 27 octobre 2023"
        voix: >-
          En octobre 2023, ses militants occupent un bâtiment du Congrès, / puis la gare de Grand Central à New York, /
          avec ce slogan : « Pas en notre **nom**. »
      - type: MD
        fichier: output/documents-3.mp4
        entree: 95
        sortie: 111
        ecran: "déjà dans le plan : fiche sur la carte (date, lieu, faits) ; pas d'IA pour un événement récent"
        source: "Briser le silence (Shovrim Shtika), fondée en 2004 ; objecteurs emprisonnés, par exemple Tal Mitnick (2023-2024)"
        voix: >-
          En Israël même, d'anciens soldats racontent ce qu'ils ont fait dans les territoires : / c'est l'association
          Briser le silence. / Et chaque année, des jeunes choisissent la prison plutôt que l'**armée**.
      - type: NOIR
        duree: 12
        source: "Pew Research Center, Jewish Americans in 2020 (attachement à Israël)"
        voix: >-
          Ces voix restent minoritaires. / Pour la plupart des Juifs dans le monde, / Israël demeure un refuge, et une
          part d'eux-**mêmes**.

  - num: "30"
    titre: "Chapitre 30 · Les religieux contre le sionisme : foi ou nationalisme ?"
    intention: >-
      L'argument religieux pris au sérieux, depuis le Talmud. Les hassidim de Satmar, puis Leibowitz, religieux et
      sioniste, qui voit venir la corruption par l'occupation. Les ultra-orthodoxes d'aujourd'hui et l'armée.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-30.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/documents.mp4
        entree: 99
        sortie: 113
        source: "Talmud de Babylone, Ketoubot 110b-111a (les trois serments)"
        voix: >-
          Leur argument vient du Talmud. / Dieu aurait fait jurer aux Juifs de ne pas « monter comme un mur » vers la
          terre d'Israël, / et de ne pas se révolter contre les **nations**.
      - type: MD
        fichier: output/documents-2.mp4
        entree: 186
        sortie: 200
        source: "Joel Teitelbaum, Vayoel Moshe, fin des années 1950"
        voix: >-
          À New York, le rabbin de Satmar, Joel Teitelbaum, en tire un livre entier contre l'État d'Israël. / Ses
          fidèles, des dizaines de milliers, s'en réclament **encore**.
      - type: MD
        fichier: output/documents-2.mp4
        entree: 200
        sortie: 212
        source: "Yeshayahou Leibowitz, textes de la fin des années 1960 sur les territoires"
        voix: >-
          Même un religieux sioniste, le philosophe Yeshayahou Leibowitz, / prévient dès la fin des années soixante : /
          l'occupation corrompra **Israël**.
      - type: MD
        fichier: output/documents-3.mp4
        entree: 111
        sortie: 122
        ecran: "déjà dans le plan : fiche sur la carte (date, lieu, faits) ; pas d'IA pour un événement récent"
        source: "Cour suprême d'Israël, arrêt du 25 juin 2024 sur la conscription des étudiants des yeshivas"
        voix: >-
          Aujourd'hui, les ultra-orthodoxes refusent le service militaire. / En 2024, la Cour suprême ordonne de les
          **mobiliser**.
      - type: NOIR
        duree: 8
        voix: >-
          Foi ou nationalisme ? / Pour eux, la réponse est claire : / un État n'est pas une **prière**.

  - num: "31"
    titre: "Chapitre 31 · Les intellectuels français : BHL, Finkielkraut et le débat public"
    intention: >-
      Leurs mots exacts, datés, non coupés. Pas d'adjectif : les citations parlent, et la date de la tribune de BHL
      (dix jours après la commission de l'ONU) dit le reste. Finkielkraut est montré en entier, y compris quand il
      écrit qu'Israël commet des crimes de guerre : le couper serait le tronquer. Une contre-voix française, Edgar
      Morin, relaxé par la Cour de cassation.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-31.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 125
        sortie: 138
        voix: >-
          En France, deux philosophes occupent les plateaux depuis quarante ans : / Bernard-Henri Lévy et Alain
          Finkielkraut. / Tous deux défendent Israël, chacun à sa **manière**.
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 138
        sortie: 150
        source: "ouverture du colloque « Democracy and its Challenges », Tel-Aviv, mai 2010 ; notre traduction"
        voix: >-
          En 2010, à Tel-Aviv, Bernard-Henri Lévy déclare : / « Je n'ai jamais vu une armée aussi démocratique, / qui se
          pose autant de questions **morales**. »
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 150
        sortie: 161
        source: "entretien avec Alexandre Devecchio, Le Figaro, 18 mars 2024"
        voix: >-
          En mars 2024, dans Le Figaro : / « Il faut le redire, / la mort des civils de Gaza n'est pas un
          **massacre**. »
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 161
        sortie: 176
        source: "Bernard-Henri Lévy, The Wall Street Journal, 25 septembre 2025 ; commission d'enquête de l'ONU, 16 septembre 2025 ; notre traduction"
        voix: >-
          En septembre 2025, dans The Wall Street Journal : / « Parler de génocide à Gaza est une offense au bon sens, /
          une manœuvre pour diaboliser Israël. » // Neuf jours plus tôt, une commission de l'ONU concluait au
          **génocide**.
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 176
        sortie: 193
        source: "entretien de Dror Mishani et Aurelia Smotriez, Haaretz, novembre 2005 ; excuses ultérieures (« mauvaise traduction »)"
        voix: >-
          Alain Finkielkraut, en 2005, au quotidien israélien Haaretz, à propos des émeutes des banlieues : / l'équipe
          de France serait « black-black-black, / ce qui fait ricaner toute l'Europe ». // Il dira avoir été mal
          **traduit**.
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 193
        sortie: 209
        source: "vidéo du Figaro, 25 octobre 2024 (texte de la page)"
        voix: >-
          Sur Gaza, en octobre 2024, dans Le Figaro : / « Quoi qu'on pense de la riposte israélienne, / le mot de
          génocide est fou, ignoble. / Il permet de nazifier les Juifs, / de leur faire perdre leur crédit victimaire.
          »
        note: "la fin de sa phrase (« et ainsi les faire basculer dans le camp des bourreaux ») peut s'ajouter si le plan s'allonge"
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 209
        sortie: 222
        source: "Louise Couvelaire, « Guerre à Gaza : des personnalités de la communauté juive française prennent position pour dénoncer la situation », Le Monde, 12 mai 2025"
        voix: >-
          Mais en mai 2025, il dit au Monde que le gouvernement Netanyahou / « mène une guerre atroce », / et
          « sacrifie délibérément les **otages** ».
        note: >-
          la « tribune sur les crimes de guerre » évoquée par Orient XXI n'existe pas : ne jamais l'attribuer. Ces
          phrases-là sont vérifiées (Perplexity, 20 octobre).
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 222
        sortie: 237
        source: >-
          Edgar Morin, Sami Naïr, Danièle Sallenave, « Israël-Palestine : le cancer », Le Monde, 4 juin 2002 ; cour
          d'appel de Versailles, 26 mai 2005 ; Cour de cassation, 1re chambre civile, 12 juillet 2006, pourvoi
          n° 05-17.704 (cassation sans renvoi)
        voix: >-
          D'autres voix juives disent l'inverse. / En 2002, Edgar Morin dénonce dans Le Monde le sort des Palestiniens.
          / Une cour d'appel y voit une diffamation raciale ; / en 2006, la Cour de cassation annule cette
          **décision**.
        note: "procédure civile : ne pas dire « condamné » ni « relaxé »"
      - type: MD
        fichier: output/documents-6.mp4
        entree: 131
        sortie: 147
        ecran: "fiche : la France · de 1957 à 2025 · Le rôle de la France"
        source: "accord nucléaire franco-israélien, 1957 ; CEDH, Baldassi et autres c. France, 11 juin 2020 ; reconnaissance de l'État de Palestine, 22 septembre 2025"
        voix: >-
          Et la France ? / En 1957, elle aide Israël à bâtir la centrale de Dimona. / En 2020, la Cour européenne la condamne pour avoir puni des appels au boycott. // En 2025, elle reconnaît la **Palestine**.
      - type: NOIR
        duree: 9
        voix: >-
          Dans ce débat, une question revient sans cesse : / qui parle de cette terre, / et qui l'on **écoute**.
