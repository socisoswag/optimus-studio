titre: "Partie VII · Une histoire universelle ?"
intro: >-
  Ce que ce conflit dit au monde : la mémoire de la Shoah et son usage, le droit international, l'effacement des noms,
  le mot apartheid, et la fracture à l'intérieur d'Israël. Le chapitre 32 est un champ de mines (bible, risque 2) :
  jamais de comparaison par nous, seulement les mots de survivants, d'historiens et de dirigeants, datés.
chapitres:
  - num: "VII.0"
    titre: "Ouverture de la partie VII"
    plans:
      - type: MD
        fichier: output/partie-7.mp4
        entree: 0
        sortie: 12.8
        ecran: "Partie VII · Une histoire universelle ?"

  - num: "32"
    titre: "Chapitre 32 · La mémoire de la Shoah : entre deuil et usage politique"
    intention: >-
      D'abord le deuil, entier : six millions, le « plus jamais », Eichmann. Puis les Juifs et Israéliens qui
      s'inquiètent de son usage (Elkana, survivant ; Levi, survivant ; Zertal, historienne). Puis un usage politique
      daté (Netanyahou, 2015) et le négationnisme dans le monde arabe et en Iran (Téhéran 2006, Abbas 2023) : les deux
      côtés.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-32.mp4
        entree: 0
        sortie: 4.6
      - type: ARCH
        fichier: output/archives-filmees/1961-proces-eichmann.mp4
        carton: output/cartons/50-arch-1961-proces-eichmann.mov
        entree: 0
        sortie: 18.22
        source: "SOURCES.md 4.2 (Universal-International News, « Trial of Century », avril 1961, domaine public)"
        ecran: "carton : Jérusalem · avril 1961 · le procès d'Adolf Eichmann"
        voix: >-
          Six millions de Juifs assassinés. / La Shoah marque l'identité d'Israël : / un peuple qui a failli
          disparaître, / et qui s'est juré « plus jamais ». // En 1961, le procès d'Adolf Eichmann fait entendre les
          **survivants**.
      - type: MD
        fichier: output/paroles.mp4
        entree: 185
        sortie: 202
        ecran: "fiche : Haaretz · 2 mars 1988 · Pour l'oubli"
        source: "Yehuda Elkana, « Pour l'oubli » (Bizkhout ha-shikheha), Haaretz, 2 mars 1988"
        voix: >-
          En 1988, Yehuda Elkana, philosophe, déporté enfant à Auschwitz, écrit dans Haaretz : / il ne voit pas de plus
          grande menace pour l'avenir d'Israël / que d'avoir fait de la Shoah l'axe de la conscience **nationale**.
      - type: MD
        fichier: output/paroles.mp4
        entree: 202
        sortie: 219
        ecran: "citation : « Chacun est le Juif de quelqu'un. » · Primo Levi"
        source: >-
          Primo Levi, Se non ora, quando ?, Einaudi, 1982, p. 187 (réplique de Mendel) ; Giampaolo Pansa, « Io, Primo
          Levi, chiedo le dimissioni di Begin », La Repubblica, 24 septembre 1982
        voix: >-
          Primo Levi, survivant d'Auschwitz, fait dire à un personnage de son roman de 1982 : / « Chacun est le Juif
          de quelqu'un. » // Après Sabra et Chatila, il demande la démission de Menahem **Begin**.
        note: >-
          vérifié (Perplexity, 20 octobre) : la phrase « aujourd'hui les Palestiniens sont les Juifs des Israéliens »
          est du critique Filippo Gentiloni (il manifesto, 29 juin 1982), jamais de Levi. Ne
          jamais la lui attribuer.
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 237
        sortie: 254
        source: "discours de Benyamin Netanyahou au 37e congrès sioniste, Jérusalem, 20 octobre 2015 ; réponse du porte-parole du gouvernement allemand, Steffen Seibert, 21 octobre 2015"
        voix: >-
          En 2015, Benyamin Netanyahou affirme que le mufti de Jérusalem aurait donné à Hitler l'idée d'exterminer les
          Juifs. / Les historiens le démentent, / et Berlin répond : la responsabilité est **allemande**.
      - type: ARCH
        fichier: output/archives-filmees/1945-ohrdruf-camp-libere.mp4
        carton: output/cartons/51-arch-1945-ohrdruf-camp-libere.mov
        entree: 0
        sortie: 17.92
        ecran: "carton : avril 1945 · Ohrdruf, Allemagne · Eisenhower, Bradley et Patton dans le camp libéré"
        source: "actualités Universal « Nazi Murder Mills », 26 avril 1945 (fiche d'époque : Ohrdruf camp viewed by Ike, Bradley, Patton), domaine public ; seulement des visages, aucun corps à l'image ; conférence de Téhéran, 11-12 décembre 2006 ; discours de Mahmoud Abbas, août 2023, et lettre ouverte de plus de cent universitaires palestiniens, septembre 2023"
        voix: >-
          La Shoah est aussi niée ou minimisée : / à Téhéran, en 2006, une conférence entière la met en doute. / En 2023,
          Mahmoud Abbas l'explique par le « rôle social » des Juifs ; / plus de cent intellectuels palestiniens le
          **condamnent**.
      - type: RÉEL
        fichier: output/plans-reels/yad-vashem-aerien.mp4
        entree: 0
        sortie: 10.24
        source: "SOURCES.md 4.1 bis, Envato P3UTT5A ; Idith Zertal, Israel's Holocaust and the Politics of Nationhood, Cambridge University Press, 2005"
        ecran: "carton lieu (à fabriquer) : Jérusalem · aujourd'hui · Yad Vashem, le mémorial de la Shoah"
        voix: >-
          Pour l'historienne israélienne Idith Zertal, / cette mémoire sert aussi à justifier la politique de l'État envers
          les **Palestiniens**.

  - num: "33"
    titre: "Chapitre 33 · Les résolutions de l'ONU ignorées : 194, 242, 338"
    intention: >-
      Les textes mot pour mot, la nuance de l'article dans la version anglaise de la 242, la réponse israélienne, et
      la résolution 2334 de 2016.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-33.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/resolutions.mp4
        entree: 0
        sortie: 6.4
        voix: >-
          Trois textes de l'ONU, / mot pour **mot**.
      - type: MD
        fichier: output/resolutions.mp4
        entree: 6.4
        sortie: 18.9
        voix: >-
          1948, résolution 194 : / permettre aux réfugiés qui le désirent de rentrer dans leurs **foyers**.
      - type: MD
        fichier: output/resolutions.mp4
        entree: 18.9
        sortie: 31.9
        voix: >-
          1967, résolution 242 : / le retrait des territoires occupés, / et le droit de chaque État de la région à vivre
          en **paix**.
      - type: MD
        fichier: output/resolutions.mp4
        entree: 31.9
        sortie: 40.5
        voix: >-
          En anglais, il manque l'article : / « from territories ». / Israël s'appuie sur ce **silence**.
      - type: MD
        fichier: output/resolutions.mp4
        entree: 40.5
        sortie: 52.5
        voix: >-
          1973, résolution 338 : / appliquer la 242, / dès le **cessez-le-feu**.
      - type: MD
        fichier: output/resolutions.mp4
        entree: 52.5
        sortie: 59.32
      - type: MD
        fichier: output/documents-6.mp4
        entree: 147
        sortie: 162
        ecran: "fiche : La Haye · 19 juillet 2024 · La Cour internationale de justice"
        source: "CIJ, avis consultatif du 19 juillet 2024 ; Assemblée générale de l'ONU, résolution ES-10/24, 18 septembre 2024"
        voix: >-
          Le 19 juillet 2024, la Cour internationale de justice le dit : / l'occupation est **illégale**. / Israël doit y mettre fin et évacuer les colons. // L'ONU lui donne douze mois.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 162
        sortie: 176
        ecran: "fiche : Washington · 14 septembre 2016 · Le soutien américain"
        source: "protocole d'accord du 14 septembre 2016 (38 milliards de dollars, 2019-2028) ; liste officielle des vetos du Conseil de sécurité, bibliothèque Dag Hammarskjöld : 52 vetos américains sur des textes concernant Israël, du 10 septembre 1972 au 18 septembre 2025 (51 projets, 1 amendement)"
        voix: >-
          Pourquoi rien ne change ? / Les États-Unis versent à Israël 3,8 milliards de dollars d'aide militaire par an, / et depuis 1972, ils ont mis leur veto 52 fois à des textes de l'ONU sur **Israël**.
        note: "52 = 51 projets et 1 amendement, périmètre large (Liban et Golan compris) : ne jamais dire « 52 résolutions »"
      - type: ARCH
        fichier: output/archives-filmees/1973-pont-aerien-americain.mp4
        carton: output/cartons/52-arch-1973-pont-aerien-americain.mov
        entree: 0
        sortie: 16.72
        ecran: "carton : octobre 1973 · Lod · Le pont aérien américain"
        source: "US Air Force, film 342-ADW-264, octobre 1973 (archives nationales américaines, identifiant 62010), domaine public"
        voix: >-
          Ce soutien se voit en 1973. / Pendant la guerre du Kippour, un pont aérien américain livre chars et munitions jusqu'à l'aéroport de **Lod**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 176
        sortie: 188
        ecran: "fiche : Jérusalem · 14 mai 2018 · L'ambassade américaine"
        source: "reconnaissance de Jérusalem par les États-Unis, 6 décembre 2017 ; ouverture de l'ambassade, 14 mai 2018"
        voix: >-
          En 2018, Washington installe son ambassade à Jérusalem. / Le même jour, à Gaza, des dizaines de manifestants sont **tués**.
      - type: MD
        fichier: output/paroles.mp4
        entree: 230
        sortie: 246
        ecran: "fiche : Nations unies · de 1948 à 2016 · La réponse d'Israël"
        source: "résolution 2334 du Conseil de sécurité, 23 décembre 2016"
        voix: >-
          Israël répond que ces textes engageaient aussi les États arabes, / qui ont longtemps refusé de le reconnaître.
          // En 2016, le Conseil de sécurité qualifie encore les colonies de « violation flagrante » du droit
          **international**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 373
        sortie: 391
        ecran: "fiche : États-Unis · aujourd'hui · Les soutiens d'Israël"
        source: "United Democracy Project (comité de l'AIPAC), cycle 2023-2024 : 61 373 653 dollars de dépenses (FEC) ; primaire Bowman-Latimer : 14 593 635 dollars (OpenSecrets) ; Christians United for Israel, plus de 10 millions de membres revendiqués (22 décembre 2020)"
        voix: >-
          En 2023 et 2024, le comité politique de l'AIPAC dépense plus de soixante millions de dollars, / dont près de quinze dans la seule primaire de Jamaal Bowman, un élu critique d'Israël. / Les évangéliques sionistes revendiquent dix millions de membres. / Et l'aide militaire profite d'abord aux industriels **américains**. // Ces groupes ne parlent pas au nom des Juifs.
        note: "jamais « lobby juif » : beaucoup de Juifs américains s'opposent à l'AIPAC (chapitre 29)"
      - type: MD
        fichier: output/documents-6.mp4
        entree: 391
        sortie: 403
        ecran: "fiche : ONU · 12 février 2020 · Les entreprises des colonies"
        source: "HCDH, base de données, A/HRC/43/71, 12 février 2020 (112 entreprises) ; mise à jour du 30 juin 2023 (97 entreprises, dont Alstom et Egis comme sociétés mères)"
        voix: >-
          Et l'argent ? / En 2020, l'ONU publie la liste des entreprises qui travaillent dans les colonies : 112 sociétés, dont Airbnb ou Booking. / En 2023, 97 y restent, dont deux groupes français, Alstom et **Egis**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 580
        sortie: 594
        ecran: "fiche : ONU · juillet 2025 · L'économie de l'occupation"
        source: "Francesca Albanese, rapport A/HRC/59/23, « De l'économie de l'occupation à l'économie du génocide », version du 30 juin 2025 (environ 1 000 entités recensées, plus de 45 nommées) ; sanctions américaines annoncées le 9 juillet 2025"
        voix: >-
          En juillet 2025, la rapporteuse de l'ONU Francesca Albanese va plus loin : / elle recense un millier d'entreprises, et en nomme des dizaines qui profitent de l'occupation et de la guerre, / des marchands d'armes aux géants de la tech. / Le 9 juillet, Washington la **sanctionne**.

  - num: "34"
    titre: "Chapitre 34 · L'effacement culturel : villages détruits, noms effacés"
    intention: >-
      La séquence parle d'elle-même ; la voix donne les paires de noms et la lecture israélienne (rendre à la terre ses
      noms bibliques). Lifta en dernier : le seul village resté debout.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-34.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/noms-effaces.mp4
        entree: 0
        sortie: 6.2
        voix: >-
          Effacer les villages, / puis leurs **noms**.
      - type: MD
        fichier: output/noms-effaces.mp4
        entree: 6.2
        sortie: 17.2
        voix: >-
          À partir de 1949, une commission gouvernementale remplace plus de neuf mille noms arabes / par des noms
          **hébreux**.
      - type: MD
        fichier: output/noms-effaces.mp4
        entree: 17.2
        sortie: 28.2
        voix: >-
          Pour l'État, c'est rendre à la terre ses noms bibliques. / Isdud devient Ashdod, / al-Majdal devient
          **Ashkelon**.
      - type: MD
        fichier: output/noms-effaces.mp4
        entree: 28.2
        sortie: 39.2
        voix: >-
          Saffuriyya devient Tzippori. / Al-Khalisa devient Kiryat **Shmona**.
      - type: MD
        fichier: output/noms-effaces.mp4
        entree: 39.2
        sortie: 49.7
        voix: >-
          Ayn Hawd devient Ein Hod, / un village d'artistes **israéliens**.
      - type: MD
        fichier: output/noms-effaces.mp4
        entree: 49.7
        sortie: 60.7
        voix: >-
          Sur Imwas, Yalu et Beit Nuba, rasés en 1967, / le Fonds national juif plante une forêt : / le Canada
          **Park**.
      - type: RÉEL
        fichier: output/plans-reels/lifta-village-abandonne-aerien.mp4
        entree: 0
        sortie: 8.24
        source: "SOURCES.md 4.1 bis, Envato 2QECUJL"
        ecran: "carton lieu (à fabriquer) : Lifta, à l'entrée de Jérusalem · aujourd'hui"
        voix: >-
          Lifta, à l'entrée de Jérusalem : / debout, mais **vide**.
      - type: MD
        fichier: output/noms-effaces.mp4
        entree: 70.3
        sortie: 77.08
      - type: MD
        fichier: output/documents-7.mp4
        entree: 202
        sortie: 217
        ecran: "fiche : Gaza · depuis octobre 2023 · Effacer aussi la mémoire"
        source: "procédures spéciales de l'ONU (Grande Mosquée al-Omari, 8 décembre 2023) ; experts de l'ONU, 18 avril 2024 (« scolasticide ») ; rapport culturel préliminaire hébergé par l'UNESCO, mars 2024"
        voix: >-
          À Gaza aussi, on efface. / En décembre 2023, la Grande Mosquée al-Omari, la plus ancienne de la ville, est gravement endommagée. / Les universités sont frappées, plusieurs détruites, / et les Archives centrales sont **perdues**.

  - num: "35"
    titre: "Chapitre 35 · Colonialisme, apartheid : le poids des mots"
    intention: >-
      Deux mots lourds, chacun attribué : « apartheid » (B'Tselem, HRW, Amnesty, la CIJ et sa formule exacte) et
      « colonialisme de peuplement » (des historiens), face à la lecture sioniste (le retour d'un peuple chez lui) et à
      la réponse d'Israël.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-35.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/apartheid-textes.mp4
        entree: 0
        sortie: 6.2
        voix: >-
          Un mot très lourd : / **apartheid**.
      - type: MD
        fichier: output/apartheid-textes.mp4
        entree: 6.2
        sortie: 17.8
        voix: >-
          En 2021, B'Tselem, une ONG israélienne, l'emploie la première, / pour tout le territoire, du Jourdain à la
          **mer**.
      - type: MD
        fichier: output/apartheid-textes.mp4
        entree: 17.8
        sortie: 28.2
        voix: >-
          Puis Human Rights **Watch**.
      - type: MD
        fichier: output/apartheid-textes.mp4
        entree: 28.2
        sortie: 40
        voix: >-
          Puis Amnesty International, en **2022**.
      - type: MD
        fichier: output/apartheid-textes.mp4
        entree: 40
        sortie: 55
        source: "CIJ, avis du 19 juillet 2024, § 229 (article 3 de la convention sur l'élimination de la discrimination raciale)"
        voix: >-
          En 2024, la Cour internationale de justice juge que la politique israélienne en Cisjordanie viole l'article
          qui interdit ségrégation et apartheid, / sans dire lequel des **deux**.
      - type: MD
        fichier: output/apartheid-textes.mp4
        entree: 55
        sortie: 61.8
      - type: MD
        fichier: output/paroles.mp4
        entree: 246
        sortie: 258
        ecran: "fiche : Position du gouvernement israélien · Israël rejette ce mot"
        voix: >-
          Israël rejette ce mot : / ses citoyens arabes votent et siègent au Parlement, / et les territoires relèvent,
          dit-il, d'un conflit, pas d'un **système**.
      - type: MD
        fichier: output/genocide-textes.mp4
        entree: 0
        sortie: 6.2
        source: "séquence « Génocide : ce que disent les textes » (timelines/genocide-textes.js)"
        voix: >-
          Un mot plus lourd encore : / **génocide**.
      - type: MD
        fichier: output/genocide-textes.mp4
        entree: 6.2
        sortie: 20.2
        source: "Convention pour la prévention et la répression du crime de génocide, 9 décembre 1948, article II (texte français officiel) ; Raphael Lemkin, Axis Rule in Occupied Europe, 1944"
        voix: >-
          Le mot naît en 1944, sous la plume d'un juriste juif polonais, Raphael Lemkin. / En 1948, après la Shoah, l'ONU en fait un crime : / des actes commis dans l'intention de détruire, en tout ou en partie, un groupe national, ethnique, racial ou **religieux**.
      - type: MD
        fichier: output/genocide-textes.mp4
        entree: 20.2
        sortie: 31.7
        source: "Amnesty International, rapport du 5 décembre 2024 ; déclaration d'Agnès Callamard"
        voix: >-
          En décembre 2024, Amnesty International conclut : / Israël a commis, et continue de commettre, un génocide à **Gaza**.
      - type: MD
        fichier: output/genocide-textes.mp4
        entree: 31.7
        sortie: 42.2
        source: "Human Rights Watch, « Extermination et actes de génocide », 19 décembre 2024"
        voix: >-
          Human Rights Watch parle d'« actes de génocide » : / Israël prive Gaza d'**eau**.
      - type: MD
        fichier: output/genocide-textes.mp4
        entree: 42.2
        sortie: 54.2
        source: "B'Tselem et Médecins pour les droits humains-Israël, « Notre génocide », 28 juillet 2025"
        voix: >-
          En juillet 2025, deux ONG israéliennes, B'Tselem et Médecins pour les droits humains, publient leur rapport. / Son titre : « Notre **génocide** ».
      - type: MD
        fichier: output/genocide-textes.mp4
        entree: 54.2
        sortie: 65.2
        source: "Association internationale des chercheurs sur le génocide (IAGS), résolution adoptée le 31 août 2025 et publiée le 1er septembre, 86 % des votants (Reuters)"
        voix: >-
          En septembre, l'association internationale des chercheurs sur le génocide adopte une résolution, à 86 % des votants : / ce qui se passe à Gaza répond à la définition **juridique**.
      - type: MD
        fichier: output/genocide-textes.mp4
        entree: 65.2
        sortie: 76.2
        source: "Omer Bartov, « I'm a Genocide Scholar. I Know It When I See It. », The New York Times, 15 juillet 2025"
        voix: >-
          Omer Bartov, historien israélien de la Shoah, écrit dans le New York Times : / « Israël commet un génocide contre le peuple **palestinien** ».
      - type: MD
        fichier: output/genocide-textes.mp4
        entree: 76.2
        sortie: 89.2
        source: "commission internationale indépendante d'enquête de l'ONU, 16 septembre 2025 (« Israel has committed genocide in the Gaza Strip ») ; déclaration de Navi Pillay"
        voix: >-
          Puis la commission d'enquête de l'ONU, présidée par une ancienne juge du tribunal pour le Rwanda : / « Il est clair qu'il existe une intention de détruire les Palestiniens à **Gaza** ».
      - type: MD
        fichier: output/genocide-textes.mp4
        entree: 89.2
        sortie: 96
      - type: MD
        fichier: output/paroles.mp4
        entree: 258
        sortie: 270
        ecran: "fiche : Position du gouvernement israélien · Israël rejette ces conclusions"
        source: "position du gouvernement israélien ; CIJ, affaire Afrique du Sud c. Israël (pas de jugement au fond au 23 octobre 2026)"
        voix: >-
          Israël rejette ces conclusions : / il dit combattre le Hamas, pas un peuple, / et invoque la légitime défense. // La Cour internationale de justice, elle, n'a pas encore jugé le **fond**.
        note: "règle 6 de la bible : qui affirme, sur quelle base, ce qui reste à juger"
      - type: MD
        fichier: output/documents-6.mp4
        entree: 188
        sortie: 202
        ecran: "fiche : Cisjordanie occupée · aujourd'hui · Les tribunaux militaires"
        source: "Defense for Children International-Palestine, No Way to Treat a Child, 14 avril 2016 (500 à 700 mineurs poursuivis chaque année ; témoignages de 2012 à 2015) ; HaMoked, d'après l'administration pénitentiaire israélienne, 1er octobre 2026 (3 101 détenus administratifs)"
        voix: >-
          Dans les années 2010, 500 à 700 enfants palestiniens sont poursuivis chaque année devant des tribunaux militaires. / Au 1er octobre 2026, 3 101 personnes sont en « détention administrative » : / sans inculpation, sans **procès**.
        note: "chiffre HaMoked lu dans l'index du site : le recontrôler sur le tableau daté avant le montage final"
      - type: MD
        fichier: output/documents-6.mp4
        entree: 482
        sortie: 497
        ecran: "fiche : Israël · août 2024 · « Bienvenue en enfer »"
        source: "B'Tselem, Welcome to Hell, 5 août 2024 (55 témoignages d'anciens détenus) ; Sde Teiman, 29 juillet 2024 : neuf soldats retenus pour interrogatoire, intrusion de manifestants et de députés d'extrême droite (AP ; Human Rights Watch, 31 juillet 2024)"
        voix: >-
          Et dans les prisons ? / En 2024, l'ONG israélienne B'Tselem recueille 55 témoignages d'anciens détenus. / Son rapport s'intitule « Bienvenue en enfer ». / Au camp de Sde Teiman, des soldats sont soupçonnés de sévices sexuels sur un **détenu**.
      - type: RÉEL
        fichier: output/plans-reels/cisjordanie-kfar-etzion-collines-vignes.mp4
        entree: 0
        sortie: 16
        ecran: "carton : Kfar Etzion, colonie israélienne · Cisjordanie occupée"
