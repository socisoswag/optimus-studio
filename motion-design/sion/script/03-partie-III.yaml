titre: "Partie III · La catastrophe fondatrice"
intro: >-
  1947-1949, puis ce qui en découle. Le cœur du film : le partage, la guerre, la Nakba. Ici plus qu'ailleurs, chaque
  récit est donné dans sa version la plus forte, puis confronté aux archives, y compris celles de l'armée israélienne
  ouvertes dans les années 1980. Les violences contre les civils sont toutes nommées : Deir Yassin, le convoi de
  Hadassah, la rue Ben Yehuda, Lydda.
chapitres:
  - num: "III.0"
    titre: "Ouverture de la partie III"
    plans:
      - type: MD
        fichier: output/partie-3.mp4
        entree: 0
        sortie: 15.8
        ecran: "Partie III · La catastrophe fondatrice"

  - num: "12"
    titre: "Chapitre 12 · 1947 : le plan de partage de l'ONU"
    intention: >-
      La carte fait le travail : un pays découpé en six morceaux qui ne se touchent que par des points. La voix
      reste sobre et laisse les chiffres parler. Puis les deux lectures du refus arabe, chacune dans sa version la plus
      forte.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-12.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/partage-1947.mp4
        entree: 0
        sortie: 12.5
        source: "SOURCES.md 5 (résolution 181, 29 novembre 1947 : 33 pour, 13 contre, 10 abstentions)"
        ecran: "carton : output/cartons/new-york-1947"
        voix: >-
          29 novembre 1947. / Près de New York, l'Assemblée générale de l'ONU vote le partage de la Palestine. //
          33 voix pour, / 13 contre, / 10 **abstentions**.
      - type: MD
        fichier: output/partage-1947.mp4
        entree: 12.5
        sortie: 24
        voix: >-
          Sur le terrain, environ un million huit cent cinquante mille habitants. / Deux tiers d'Arabes, / un tiers de
          **Juifs**.
      - type: MD
        fichier: output/partage-1947.mp4
        entree: 24
        sortie: 35.5
        voix: >-
          Le plan coupe le pays en deux États, / et laisse Jérusalem sous régime **international**.
      - type: MD
        fichier: output/partage-1947.mp4
        entree: 35.5
        sortie: 45
        voix: >-
          Chaque État en trois morceaux, / qui ne se touchent que par des **points**.
      - type: MD
        fichier: output/partage-1947.mp4
        entree: 45
        sortie: 57.8
        note: "les deux nœuds, au nord et au sud : pas de voix, la carte suffit"
      - type: MD
        fichier: output/partage-1947.mp4
        entree: 57.8
        sortie: 64
        voix: >-
          Jaffa, ville arabe, se retrouve **enclavée**.
      - type: MD
        fichier: output/partage-1947.mp4
        entree: 64
        sortie: 76
        voix: >-
          L'État juif reçoit 56 % du territoire, / désert du Néguev compris. // Les Juifs forment un tiers de la
          **population**.
      - type: MD
        fichier: output/partage-1947.mp4
        entree: 76
        sortie: 84.6
        voix: >-
          Et dans cet État juif vivent plus de 400 000 **Arabes**.
      - type: MD
        fichier: output/partage-1947.mp4
        entree: 84.6
        sortie: 97.8
        voix: >-
          L'Agence juive accepte. / Les dirigeants arabes refusent. // Le lendemain, la guerre civile **commence**.
      - type: MD
        fichier: output/documents-2.mp4
        entree: 111
        sortie: 135
        source: "terres en propriété juive : moins de 6 % (Village Statistics, 1945) ; SOURCES.md 5, partie II"
        voix: >-
          Pour les Israéliens, tout part de ce refus : / ils acceptaient un compromis, on leur a fait la guerre. //
          Les Palestiniens posent une autre question : / pourquoi les deux tiers des habitants devraient-ils céder plus de
          la moitié du pays / à ceux qui en possèdent moins de six pour cent des **terres** ?

  - num: "13"
    titre: "Chapitre 13 · 1948 : la création d'Israël et la Nakba"
    reserve:
      - fichier: output/archives-filmees/1946-camp-refugies-juifs-autriche.mp4
        type: ARCH
        note: "Septembre 1946 · Autriche · des rescapés juifs au camp de personnes déplacées d'Admont, qui attendent de partir pour la Palestine (actualités Universal, domaine public) : avant les plans de 1947-1948"
    intention: >-
      Une même année, deux mémoires : l'indépendance et la survie pour les uns, la catastrophe pour les autres. La
      carte de la guerre, puis les lumières des villages vidés. Le point décisif : ce que les historiens israéliens
      ont trouvé dans les archives de leur propre armée.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-13.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/chronologie.mp4
        entree: 32.4
        sortie: 36.8
        ecran: "fiche de la chronologie : David Ben Gourion · carton : output/cartons/tel-aviv-1948"
        voix: >-
          14 mai 1948. / Ben Gourion proclame l'État d'**Israël**.
      - type: MD
        fichier: output/nakba-1948.mp4
        entree: 0
        sortie: 6
        voix: >-
          Pour les Palestiniens, c'est la Nakba. / La **catastrophe**.
      - type: MD
        fichier: output/documents-7.mp4
        entree: 85
        sortie: 100
        ecran: "fiche : Haganah · 10 mars 1948 · Le plan Dalet"
        source: "plan Dalet de la Haganah, 10 mars 1948 (traduction de Walid Khalidi, Journal of Palestine Studies, 1988) ; Ilan Pappé, Le Nettoyage ethnique de la Palestine, 2006 ; Benny Morris, 2004"
        voix: >-
          Dès le 10 mars 1948, la Haganah adopte le plan Dalet. / Il prévoit de détruire des villages, / et, en cas de résistance, / d'expulser leurs habitants « hors des frontières de l'**État** ».
      - type: MD
        fichier: output/nakba-1948.mp4
        entree: 6
        sortie: 20
        voix: >-
          Avant même l'entrée des armées arabes, / Tibériade, Haïfa, Safed et Jaffa sont prises. / Leurs habitants
          arabes fuient, / ou sont **chassés**.
      - type: MD
        fichier: output/nakba-1948.mp4
        entree: 20
        sortie: 32
        source: "pertes israéliennes : environ 6 000 morts (ministère israélien de la Défense), pour environ 650 000 Juifs"
        voix: >-
          Le 15 mai, cinq armées arabes entrent en guerre. / Pour Israël, c'est une guerre de survie : / environ six
          mille morts, / un Juif du pays sur **cent**.
      - type: MD
        fichier: output/nakba-1948.mp4
        entree: 32
        sortie: 44
        ecran: "carton : output/cartons/lydda-1948"
        voix: >-
          En juillet, à Lydda et Ramle, / entre cinquante et soixante-dix mille habitants sont expulsés. / Ils marchent
          vers l'est, en pleine **chaleur**.
      - type: MD
        fichier: output/nakba-1948.mp4
        entree: 44
        sortie: 59
        voix: >-
          À l'automne, / le Néguev, / puis la **Galilée**.
      - type: MD
        fichier: output/nakba-1948.mp4
        entree: 59
        sortie: 72
        source: "Walid Khalidi (dir.), All That Remains, Institute for Palestine Studies, 1992 (418 villages)"
        voix: >-
          En tout, plus de quatre cents villages sont vidés. / La plupart sont rasés. // Leurs habitants ne reviendront
          **jamais**.
      - type: MD
        fichier: output/nakba-1948.mp4
        entree: 72
        sortie: 83
        voix: >-
          En 1949, Israël tient 78 % de la Palestine mandataire. / La Cisjordanie passe à la Jordanie, / Gaza à
          l'**Égypte**.
      - type: MD
        fichier: output/nakba-1948.mp4
        entree: 83
        sortie: 93
        source: "résolution 194 (III) de l'Assemblée générale, 11 décembre 1948, paragraphe 11"
        voix: >-
          Le 11 décembre 1948, l'ONU demande que les réfugiés qui le souhaitent puissent rentrer chez eux. // Ce n'est
          jamais **appliqué**.
      - type: MD
        fichier: output/flux-humains.mp4
        entree: 6.2
        sortie: 20.7
        voix: >-
          Environ sept cent mille Palestiniens deviennent réfugiés, / au Liban, en Syrie, en Transjordanie, en
          Cisjordanie et à **Gaza**.
      - type: MD
        fichier: output/chronologie.mp4
        entree: 36.8
        sortie: 41.6
        ecran: "fiche de la chronologie : 1948, deux regards"
        voix: >-
          Une même année. / Deux **mémoires**.
      - type: ARCH
        fichier: output/archives-filmees/1950-sands-of-sorrow-refugies.mp4
        entree: 0
        sortie: 16
        source: "SOURCES.md 4.2 (Sands of Sorrow, Theodore A. Morde, 1950 : « les premières images filmées des réfugiés arabes de Palestine », domaine public)"
        ecran: "carton : Bande de Gaza · 1950 · un camp de réfugiés"
        voix: >-
          Pendant des décennies, le récit officiel israélien affirme : / ils sont partis à l'appel des dirigeants
          arabes. // À partir des années 1980, des historiens israéliens ouvrent les archives de leur propre **armée**.
      - type: 3D
        fichier: output/villages-lumieres.mp4
        entree: 0
        sortie: 25
        ecran: "déjà dans la pièce : 1947 · 1949 · Les villages vidés · Chaque lumière, un village palestinien dépeuplé"
        son: "la nuit, le vent ; une note grave à chaque vague de lumières"
      - type: 3D
        fichier: output/villages-lumieres.mp4
        entree: 25
        sortie: 45
        source: >-
          Benny Morris, The Birth of the Palestinian Refugee Problem Revisited, Cambridge University Press, 2004 ;
          décision du gouvernement israélien d'empêcher le retour, 16 juin 1948 (même ouvrage)
        voix: >-
          Benny Morris, le plus cité d'entre eux, conclut : / la plupart ont fui les combats et la peur, / beaucoup ont
          été expulsés, / et seule une petite partie est partie sur ordre de dirigeants arabes. // Le retour leur est
          interdit dès juin **1948**.

  - num: "14"
    titre: "Chapitre 14 · Les milices juives : Haganah, Irgoun, Lehi"
    intention: >-
      Trois forces, trois cultures politiques, et deux futurs Premiers ministres. Le chapitre montre aussi les
      combattants arabes et les attentats contre les civils juifs : le film ne choisit pas ses morts.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-14.mp4
        entree: 0
        sortie: 4.6
      - type: IA
        fichier: output/reconstitutions/17-27-haganah-1948.mp4
        photo: "Wikimedia Commons, « Training for the Hagana », GPO, 4 avril 1948, CC BY-SA 3.0"
        entree: 0
        sortie: 12
        ecran: "déjà dans le plan : Avril 1948 · Palestine · L'entraînement de recrues de la Haganah · la vraie photo, puis Reconstitution par IA, d'après une photo d'archive · GPO, CC BY-SA 3.0"
        voix: >-
          Côté juif, trois forces armées. / La Haganah, la plus grande, liée à Ben Gourion. / Et deux groupes plus
          radicaux : / l'Irgoun et le **Lehi**.
      - type: IA
        fichier: output/reconstitutions/18-22-king-david-1946.mp4
        entree: 0
        sortie: 13
        photo: "Bibliothèque du Congrès, collection Matson, matpc 12969, juillet 1946"
        source: "attentat du 22 juillet 1946 : 91 morts ; photo SOURCES.md 2.2, matpc 12969 (Matson, juillet 1946)"
        ecran: "déjà dans le plan : 22 juillet 1946 · Jérusalem · L'hôtel King David après l'attentat de l'Irgoun · Photo d'archive animée par IA"
        voix: >-
          Le 22 juillet 1946, l'Irgoun fait sauter une aile de l'hôtel King David, / siège de l'administration
          britannique à Jérusalem. // 91 **morts**.
      - type: MD
        fichier: output/portraits-2.mp4
        entree: 0
        sortie: 12
        voix: >-
          Son chef, Menahem Begin, sera Premier ministre d'Israël en 1977, / et prix Nobel de la paix l'année
          **suivante**.
      - type: MD
        fichier: output/portraits-2.mp4
        entree: 12
        sortie: 26
        source: "Lord Moyne, tué au Caire le 6 novembre 1944 ; Folke Bernadotte, tué à Jérusalem le 17 septembre 1948"
        voix: >-
          Le Lehi assassine en 1944 un ministre britannique, Lord Moyne, / puis en 1948 le médiateur de l'ONU, Folke
          Bernadotte. // Un de ses chefs, Yitzhak Shamir, sera lui aussi Premier **ministre**.
      - type: MD
        fichier: output/chronologie.mp4
        entree: 28
        sortie: 32.4
        ecran: "fiche de la chronologie : Abd al-Qadir al-Husseini"
        voix: >-
          Côté arabe, des milices **locales**.
      - type: MD
        fichier: output/portraits-2.mp4
        entree: 26
        sortie: 35
        voix: >-
          Leur chef le plus populaire, Abd al-Qadir al-Husseini, / est tué le 8 avril 1948 à **al-Qastal**.
      - type: MD
        fichier: output/documents-2.mp4
        entree: 135
        sortie: 146
        source: "attentat de la rue Ben Yehuda, Jérusalem, 22 février 1948 (environ 50 morts selon les sources)"
        voix: >-
          Les civils juifs sont visés aussi. / Le 22 février 1948, à Jérusalem, / une bombe tue des dizaines de
          personnes rue Ben **Yehuda**.
      - type: MD
        fichier: output/documents.mp4
        entree: 38
        sortie: 55
        source: >-
          lettre au New York Times, 4 décembre 1948, signée notamment par Albert Einstein et Hannah Arendt ; notre
          traduction
        ecran: "« proche, par son organisation, ses méthodes, sa philosophie politique, des partis nazi et fasciste »"
        voix: >-
          En décembre 1948, quand Begin vient aux États-Unis, / des intellectuels juifs, dont Albert Einstein et Hannah
          Arendt, / jugent son parti « proche, par ses méthodes, / des partis nazi et **fasciste** ».
        note: >-
          gardée (choix de l'auteur, 20 octobre). Seule comparaison du film avec l'Allemagne nazie, mais ce sont les
          mots de Juifs, en 1948 : la lire sans effet, et montrer la page du journal.

  - num: "15"
    titre: "Chapitre 15 · Le massacre de Deir Yassin"
    intention: >-
      La séquence existe ; la voix l'accompagne sans la doubler. Puis la condamnation par la direction juive, et le
      massacre du convoi de Hadassah quatre jours plus tard : les deux faits sont liés dans l'histoire, ils le sont
      dans le film.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-15.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/deir-yassin.mp4
        entree: 0
        sortie: 6
        ecran: "carton : output/cartons/deir-yassin-1948"
        voix: >-
          9 avril 1948. / Deir Yassin, un village à l'ouest de **Jérusalem**.
      - type: MD
        fichier: output/deir-yassin.mp4
        entree: 6
        sortie: 19
        voix: >-
          À l'aube, des miliciens de l'Irgoun et du Lehi entrent dans le village. / Maison après maison, des habitants
          sont tués : / des hommes, des femmes, des **enfants**.
      - type: MD
        fichier: output/deir-yassin.mp4
        entree: 19
        sortie: 30
        source: "SOURCES.md 5 (Deir Yassin : université de Birzeit, environ 107 morts, estimations de 101 à 140)"
        voix: >-
          Environ cent sept morts, selon les recherches de l'université palestinienne de Birzeit. / Sur le moment,
          l'Irgoun en annonce plus du **double**.
      - type: MD
        fichier: output/deir-yassin.mp4
        entree: 30
        sortie: 41
        voix: >-
          Le récit du massacre se répand dans tout le pays, / et accélère l'**exode**.
      - type: MD
        fichier: output/deir-yassin.mp4
        entree: 41
        sortie: 50
        voix: >-
          Aujourd'hui, les maisons du village abritent un hôpital psychiatrique **israélien**. ///
      - type: MD
        fichier: output/documents.mp4
        entree: 152
        sortie: 173
        source: "condamnation par l'Agence juive et la Haganah ; message de Ben Gourion au roi Abdallah ; convoi de Hadassah, 13 avril 1948, 78 morts"
        ecran: "Jérusalem · avril 1948 · Le convoi de Hadassah · 78 morts, médecins, infirmières et patients"
        voix: >-
          L'Agence juive et la Haganah condamnent le massacre ; / Ben Gourion présente des excuses au roi Abdallah de
          Transjordanie. // Quatre jours plus tard, à Jérusalem, / des combattants arabes attaquent un convoi de l'hôpital
          Hadassah : / 78 morts, médecins, infirmières et **patients**.
      - type: MD
        fichier: output/documents-7.mp4
        entree: 100
        sortie: 115
        ecran: "fiche : Tantura · mai 1948 · Tantura et al-Dawayima"
        source: "Tantura, 22-23 mai 1948 (Teddy Katz, 1998 ; Alon Schwarz, « Tantura », 2022) ; al-Dawayima, 29 octobre 1948 (Benny Morris, 2004)"
        voix: >-
          Deir Yassin n'est pas un cas isolé. / À Tantura, en mai 1948, des dizaines d'hommes sont tués après la prise du village. / À al-Dawayima, en octobre, des dizaines, peut-être des centaines. // En 2022, d'anciens soldats israéliens racontent Tantura devant la **caméra**.

  - num: "16"
    titre: "Chapitre 16 · David Ben Gourion : l'État avant tout"
    intention: >-
      Le portrait le plus délicat. D'abord ce qu'il est pour les Israéliens, sincèrement. Puis ses propres mots
      (1938), ce que raconte Rabin de Lydda, et le gouvernement militaire imposé aux Arabes restés. Le titre (« l'État
      avant tout ») annonce le sujet ; ce sont les faits qui donnent la conclusion.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-16.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/portraits-2.mp4
        entree: 35
        sortie: 49
        voix: >-
          Pour la plupart des Israéliens, David Ben Gourion est le père de la nation. / Il a bâti un État, une armée,
          / et accueilli des centaines de milliers de réfugiés **juifs**.
      - type: MD
        fichier: output/documents.mp4
        entree: 55
        sortie: 69
        source: "déclaration d'indépendance de l'État d'Israël, 14 mai 1948 ; notre traduction"
        voix: >-
          La déclaration d'indépendance promet « l'égalité complète des droits sociaux et politiques à tous ses
          habitants, / sans distinction de religion, de race ou de **sexe** ».
      - type: MD
        fichier: output/citation-ben-gourion.mp4
        entree: 0
        sortie: 12
        source: "SOURCES.md 6 (réunion de l'Exécutif de l'Agence juive, 12 juin 1938, d'après Benny Morris)"
        voix: >-
          Mais dix ans plus tôt, devant la direction sioniste, / il disait : / « Je suis pour le transfert forcé. / Je
          n'y vois rien d'**immoral**. »
      - type: MD
        fichier: output/portraits-2.mp4
        entree: 49
        sortie: 68
        source: "passage censuré des mémoires d'Yitzhak Rabin, publié par The New York Times, 23 octobre 1979"
        voix: >-
          Juillet 1948. / Selon les mémoires d'Yitzhak Rabin, quand on lui demande ce qu'il faut faire des habitants de
          Lydda, / Ben Gourion fait un geste de la main, / qui veut dire : « Chassez-les. » // Ce passage avait été
          censuré en **Israël**.
      - type: MD
        fichier: output/documents-4.mp4
        entree: 0
        sortie: 13
        ecran: "fiche : Galilée, Triangle, Néguev · 1948 à 1966 · Le gouvernement militaire"
        source: "gouvernement militaire sur les citoyens arabes d'Israël, 1948-1966 (Shira Robinson, Citizen Strangers, Stanford University Press, 2013)"
        voix: >-
          Les Arabes restés en Israël deviennent citoyens. / Mais jusqu'en 1966, ils vivent sous gouvernement militaire
          : / il leur faut un permis pour quitter leur **village**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 0
        sortie: 15
        ecran: "fiche : Knesset · 1950 · Deux lois de 1950"
        source: "loi sur les biens des absents, 14 mars 1950 ; loi du retour, 5 juillet 1950"
        voix: >-
          En 1950, deux lois. / La loi du retour : tout Juif du monde peut devenir israélien. / La loi sur les biens des absents : les terres des réfugiés passent à l'État. // Eux ne pourront pas **revenir**.
      - type: NOIR
        duree: 8
        voix: >-
          Un bâtisseur, pour les uns. / Pour les autres, / l'homme qui a fermé la porte du **retour**.

  - num: "17"
    titre: "Chapitre 17 · L'exode des Juifs des pays arabes"
    intention: >-
      L'autre exil, souvent oublié en Europe. Des violences réelles, des lois de déchéance, et aussi des départs
      organisés par les émissaires sionistes. Puis l'argument de « l'échange de populations », et la réponse
      palestinienne : les deux sont dits.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-17.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/flux-humains.mp4
        entree: 20.7
        sortie: 37.7
        voix: >-
          Dans le même temps, environ 850 000 Juifs quittent les pays arabes, / du Maroc à l'Irak. / La plupart
          s'installent en **Israël**.
      - type: IA
        fichier: output/reconstitutions/19-24-immigrants-irak-lod-1951.mp4
        photo: "Wikimedia Commons, « Immigrants 1951 », GPO, mai 1951, domaine public"
        entree: 0
        sortie: 17
        ecran: "déjà dans le plan : Mai 1951 · Aéroport de Lod · Des immigrants juifs d'Irak à leur arrivée · Photo d'archive animée par IA"
        source: "Farhoud, Bagdad, 1er et 2 juin 1941 (bilans de plus d'une centaine à près de deux cents morts) ; loi irakienne de 1950 ; expulsions d'Égypte après 1956"
        voix: >-
          Certains fuient des violences : / à Bagdad, en juin 1941, le Farhoud fait plus d'une centaine de morts juifs.
          // Après 1948, l'Irak ne les laisse partir qu'en renonçant à leur nationalité ; / l'Égypte en expulse des
          milliers après **1956**.
      - type: IA
        fichier: output/reconstitutions/20-25-maabara-nahariya-1952.mp4
        photo: "Wikimedia Commons, « Nahariya Maabara », Fritz Cohen, GPO, février 1952, domaine public"
        entree: 0
        sortie: 16
        ecran: "déjà dans le plan : Février 1952 · Nahariya · Une maabara, camp de transit des nouveaux immigrants · Photo d'archive animée par IA"
        source: "opérations Tapis volant (Yémen, 1949-1950) et Ezra et Néhémie (Irak, 1951-1952) ; maabarot"
        voix: >-
          D'autres sont poussés au départ par les émissaires sionistes, / qui organisent des ponts aériens, du Yémen à
          l'Irak. // En Israël, beaucoup vivent des années dans des camps de **toile**.
      - type: MD
        fichier: output/flux-humains.mp4
        entree: 37.7
        sortie: 44.52
        ecran: "déjà dans la pièce : Deux exils. Deux mémoires. Une même terre."
      - type: NOIR
        duree: 9
        voix: >-
