        source: "Bezalel Smotrich, chaîne de la Knesset, octobre 2015 (cité par N12, 5 mai 2026, et Zman Israel, 23 septembre 2026)"
        voix: >-
          Dès 2015, Bezalel Smotrich, aujourd'hui ministre des Finances, le disait à sa façon : / « L'Autorité palestinienne est un fardeau, / et le Hamas est un **atout**. »
      - type: MD
        fichier: output/documents-6.mp4
        entree: 430
        sortie: 443
        ecran: "fiche : Israël · 2022 et 2023 · Le plan « Mur de Jéricho »"
        source: "R. Bergman et A. Goldman, The New York Times, 30 novembre 2023 (document d'une quarantaine de pages, nom de code « Jericho Wall »)"
        voix: >-
          Et le plan du Hamas, l'armée l'avait. / Plus d'un an avant le 7 octobre, un document d'une quarantaine de pages décrit l'attaque. / Ses chefs le jugent hors de portée du **Hamas**.
