        voix: >-
          De 2008 à septembre 2023, l'ONU compte 6 407 Palestiniens tués, / à Gaza et en Cisjordanie, / et 308 Israéliens. / Avant le 7 **octobre**.
      - type: MD
        fichier: output/documents-7.mp4
        entree: 115
        sortie: 129
        ecran: "fiche : Israël · octobre 2008 · La doctrine Dahiya"
        source: "Gadi Eisenkot, alors chef du front nord, Yedioth Ahronoth, 3 octobre 2008 (repris par Ynet et Reuters)"
        voix: >-
          Ces offensives suivent une doctrine. / En 2008, le général Gadi Eisenkot, futur chef d'état-major, l'explique : / « Nous emploierons une force disproportionnée. » / Les villages d'où l'on tire « ne sont pas des villages civils, ce sont des bases **militaires** ».
      - type: MD
        fichier: output/documents-6.mp4
        entree: 93
        sortie: 105
        ecran: "fiche : eaux internationales · 31 mai 2010 · Le Mavi Marmara"
        source: "abordage du Mavi Marmara, 31 mai 2010 : neuf militants tués, un dixième mort de ses blessures en 2014"
        voix: >-
          En 2010, une flottille tente de briser le blocus. / L'armée israélienne prend d'assaut le Mavi Marmara : / dix militants en **meurent**.
      - type: MD
