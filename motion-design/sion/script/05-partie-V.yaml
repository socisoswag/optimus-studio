        note: "vraie image à la place de la fiche de gaza-guerres (6 à 16) ; les chiffres passent au carton ; Al Jazeera, rushes « gaza09012009 », CC BY 3.0 (SOURCES.md 4.2)"
        source: "B'Tselem, 9 septembre 2009 (1 387 tués, dont 320 mineurs) ; Centre palestinien pour les droits de l'homme (PCHR), décembre 2011 (1 419 tués, dont 1 167 civils) ; 13 Israéliens tués"
        voix: >-
          Fin 2008, « Plomb durci » : / en trois semaines, environ 1 400 Palestiniens sont tués. / Côté israélien, 13 **morts**.
      - type: ARCH
        fichier: output/plans-reels/gaza-2009-rue-plomb-durci.mp4
        carton: output/cartons/75-arch-gaza-2009-rue-plomb-durci.mov
