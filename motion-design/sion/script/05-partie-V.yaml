        source: "SOURCES.md 4.2, Wikimedia Commons, « Aljazeeraasset-GAZA FAMILY186 », Al Jazeera, CC BY 3.0 (logos hors cadre) ; mission d'enquête de l'ONU sur le conflit de Gaza, rapport A/HRC/12/48, septembre 2009 ; R. Goldstone, The Washington Post, avril 2011 ; déclaration de H. Jilani, C. Chinkin et D. Travers, 14 avril 2011"
        voix: >-
          En 2009, une mission de l'ONU, menée par le juge Richard Goldstone, / y voit des crimes de guerre, des deux côtés. // Deux ans plus tard, Goldstone revient sur un point. / Ses trois coauteurs, eux, maintiennent le **rapport**.
        note: "le point retiré par Goldstone : une politique visant délibérément les civils ; ne pas dire qu'il a renié le rapport"
      - type: MD
        fichier: output/gaza-guerres.mp4
        entree: 30
        sortie: 39
        ecran: "fiche : Pilier de défense · 167 Palestiniens tués selon B'Tselem (182 selon l'OMS)"
        source: "B'Tselem, rapport de mai 2013 (167 tués, dont au moins 87 qui ne prenaient pas part aux combats ; 4 civils et 2 membres des forces de sécurité tués en Israël) ; OMS, bureau des territoires palestiniens, rapport de novembre 2012 : 182 tués à Gaza, dont 47 enfants (le bilan de 185 n'a pas été retrouvé dans un bulletin d'origine : retiré, dossier Perplexity du 30 octobre 2026)"
        voix: >-
          En novembre 2012, huit jours de guerre : / entre 167 et 182 morts à Gaza selon les sources, / six en **Israël**.
