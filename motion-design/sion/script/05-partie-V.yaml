        voix: >-
          À l'été 2014, « Bordure protectrice » : / 2 251 Palestiniens tués selon l'ONU, 2 310 selon le ministère de la Santé de Gaza, / dont 551 enfants. / En Israël, 67 soldats et six **civils**.
      - type: MD
        fichier: output/gaza-guerres.mp4
        entree: 52
