        entree: 67
        sortie: 80
        ecran: "fiche : Washington · 15 septembre 2020 · Les accords d'Abraham"
        source: "accords d'Abraham, 15 septembre 2020"
        voix: >-
          En 2020, les Émirats et Bahreïn, puis le Maroc et le Soudan, reconnaissent Israël. / Sans attendre d'État palestinien. // La cause palestinienne semble **oubliée**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 105
        sortie: 118
        ecran: "fiche : Gaza · de 2018 à 2023 · L'argent du Qatar"
        source: "M. Mazzetti et R. Bergman, « Buying Quiet », The New York Times, 10 décembre 2023 (15 millions de dollars par mois en espèces en 2018, environ 30 millions par mois en 2021 ; réponse du bureau de Netanyahou : des raisons humanitaires)"
        voix: >-
          Pendant ce temps, Netanyahou laisse le Qatar verser des millions de dollars par mois à Gaza, gouvernée par le Hamas. / Selon le New York Times, il parie qu'un Hamas fort, mais pas trop, / éloignera la pression pour un État **palestinien**.
        note: "« selon le New York Times » : c'est la synthèse de l'enquête, pas un aveu enregistré ; le démenti vient au plan suivant"
      - type: MD
        fichier: output/documents-6.mp4
        entree: 403
        sortie: 419
        ecran: "citation : Benyamin Netanyahou · réunion du Likoud, mars 2019 (propos rapportés)"
        source: "propos rapportés d'une réunion du Likoud, mars 2019 (Maariv ; Haaretz, 9 octobre et 15 novembre 2023 ; Tal Schneider, The Times of Israel, 8 octobre 2023) ; démenti de Netanyahou, entretien avec TIME du 4 août 2024 ; réponse de son bureau au New York Times, décembre 2023"
        voix: >-
          En 2019, la presse israélienne lui prête ces mots : / « Celui qui veut empêcher la création d'un État palestinien / doit soutenir le renforcement du Hamas, et le transfert d'argent au Hamas. » // Il dément l'avoir dit ; / son bureau parle d'aide **humanitaire**.
        note: "règle 6 de la bible : propos rapportés d'une réunion fermée, le démenti est dit dans le même plan"
      - type: MD
        fichier: output/documents-6.mp4
        entree: 419
