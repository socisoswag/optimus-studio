titre: "Partie V · La dérive d'un projet"
intro: >-
  L'Israël d'aujourd'hui, par ses dirigeants. Règle 7 de la bible, sans exception : les personnes vivantes ne sont
  montrées qu'à travers leurs propres mots, datés et sourcés, et des faits établis (condamnations, mandats, votes).
  Aucun adjectif sur elles. Le 7 octobre est raconté sans détour, puis Gaza, avec les qualifications attribuées à
  ceux qui les prononcent (Cour internationale de justice, CPI, commission de l'ONU).
chapitres:
  - num: "V.0"
    titre: "Ouverture de la partie V"
    plans:
      - type: MD
        fichier: output/partie-5.mp4
        entree: 0
        sortie: 14
        ecran: "Partie V · La dérive d'un projet"

  - num: "24"
    titre: "Chapitre 24 · Netanyahou, Lieberman : leurs propres mots"
    intention: >-
      Leurs mots, rien que leurs mots : le titre le dit, et les citations jugent d'elles-mêmes. La loi de 2018 est citée comme un texte de loi, pas comme une opinion.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-24.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/figures-aujourdhui.mp4
        entree: 0
        sortie: 5.4
        ecran: "Israël depuis 1996 · les figures de la droite au pouvoir"
      - type: MD
        fichier: output/figures-aujourdhui.mp4
        entree: 5.4
        sortie: 10.2
        ecran: "fiche : Benyamin Netanyahou"
        voix: >-
          Benyamin Netanyahou. / Premier ministre pour la première fois en **1996**.
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 0
        sortie: 12
        source: "vidéo de Benyamin Netanyahou, jour des élections, 17 mars 2015 ; notre traduction"
        voix: >-
          Le jour des élections de 2015, il lance aux électeurs de droite : / « Les électeurs arabes se rendent en
          masse aux urnes. » // Un citoyen sur cinq est **arabe**.
      - type: MD
        fichier: output/documents.mp4
        entree: 69
        sortie: 84
        source: "Loi fondamentale : Israël, État-nation du peuple juif, 19 juillet 2018, article 1 (c) et article 4 ; notre traduction"
        voix: >-
          En 2018, une loi fondamentale proclame : / « Le droit à l'autodétermination nationale dans l'État d'Israël
          est propre au peuple juif. » // L'arabe perd son statut de langue **officielle**.
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 12
        sortie: 21
        source: "message de Benyamin Netanyahou sur Instagram, 10 mars 2019"
        voix: >-
          Netanyahou précise : / « Israël n'est pas l'État de tous ses citoyens. »
      - type: MD
        fichier: output/figures-aujourdhui.mp4
        entree: 10.2
        sortie: 15
        ecran: "fiche : Avigdor Lieberman (« Pas de loyauté, pas de citoyenneté », 2009)"
        voix: >-
          Avigdor Lieberman, ministre des Affaires étrangères puis de la **Défense**.
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 21
        sortie: 45
        source: >-
          entretien avec Oudi Segal, congrès « Démocratie électorale 2015 », Centre interdisciplinaire d'Herzliya,
          8 mars 2015 ; texte hébreu publié le jour même par N12 / Mako ; le parquet refuse d'ouvrir une enquête le
          25 mai 2015 (Adalah) ; notre traduction
        ecran: "« Celui qui est contre nous, il n'y a rien à faire : il faut lever une hache et lui couper la tête »"
        voix: >-
          En mars 2015, à propos des citoyens arabes d'Israël : / « Celui qui est avec nous doit tout recevoir, /
          jusqu'à la moitié du royaume. / Celui qui est contre nous, il n'y a rien à faire : / il faut lever une hache,
          et lui couper la tête. / Sinon, nous ne survivrons pas ici. » // Le parquet refuse d'ouvrir une
          **enquête**.
        note: >-
          texte vérifié sur la source hébraïque du jour (Perplexity, 20 octobre) : singulier, phrase entière, sans
          rien couper. « Les citoyens arabes » est le contexte donné par N12, hors des guillemets.
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 45
        sortie: 59
        source: "conférence de presse de Benyamin Netanyahou, 18 janvier 2024 ; déclaration du 21 septembre 2025"
        voix: >-
          En septembre 2025, Netanyahou résume son action : / « Pendant des années, j'ai empêché la création de cet
          État terroriste. » // Il parle de l'État **palestinien**.

  - num: "25"
    titre: "Chapitre 25 · Gaza : le blocus, le 7 octobre, la guerre"
    intention: >-
      Le chapitre le plus dur du film. Le 7 octobre est raconté en premier, et sans détour : c'est la condition pour
      être entendu ensuite sur Gaza. Puis le blocus, les offensives, le siège, les morts, les ruines, et ce que disent
      les juges. La thèse du « laboratoire » est attribuée à celui qui la défend. Aucune image de corps.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-25.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/documents-6.mp4
        entree: 228
        sortie: 241
        ecran: "fiche : Gaza · août et septembre 2005 · Le retrait de Gaza"
        source: "plan de désengagement, août-septembre 2005 ; position de l'ONU sur l'occupation de Gaza"
        voix: >-
          En 2005, Ariel Sharon fait évacuer les colonies de Gaza. / Mais Israël garde les frontières, la mer et le ciel : / pour l'ONU, Gaza reste **occupée**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 241
        sortie: 254
        ecran: "fiche : 25 janvier 2006 · Le Hamas gagne les élections"
        source: "élections législatives palestiniennes du 25 janvier 2006"
        voix: >-
          En janvier 2006, le Hamas gagne les élections. / Israël, les États-Unis et l'Europe boycottent son gouvernement. / Depuis, les Palestiniens n'ont plus **voté**.
      - type: MD
        fichier: output/gaza.mp4
        entree: 0
        sortie: 6
        voix: >-
          Gaza. / Plus de deux millions d'habitants, / sur 365 kilomètres **carrés**.
      - type: MD
        fichier: output/gaza.mp4
        entree: 6
        sortie: 17
        ecran: "carton : output/cartons/gaza-2007"
        voix: >-
          En 2007, le Hamas prend le pouvoir. / Israël, avec l'Égypte, boucle le territoire par terre, par mer et par
          **air**.
      - type: MD
        fichier: output/gaza.mp4
        entree: 17
        sortie: 30
        voix: >-
          Puis les offensives : 2008, 2014, 2021. / Des milliers de morts à Gaza ; / des dizaines en **Israël**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 93
        sortie: 105
        ecran: "fiche : eaux internationales · 31 mai 2010 · Le Mavi Marmara"
        source: "abordage du Mavi Marmara, 31 mai 2010 : neuf militants tués, un dixième mort de ses blessures en 2014"
        voix: >-
          En 2010, une flottille tente de briser le blocus. / L'armée israélienne prend d'assaut le Mavi Marmara : / dix militants en **meurent**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 348
        sortie: 361
        ecran: "fiche : Gaza · 18 octobre 2011 · L'échange Shalit"
        source: "échange de Gilad Shalit, 18 octobre 2011 : 1 027 prisonniers palestiniens libérés, dont Yahya Sinwar"
        voix: >-
          En 2011, Israël échange le soldat Gilad Shalit, otage depuis cinq ans, contre 1 027 prisonniers palestiniens. / Parmi eux, Yahya Sinwar : / il dirigera le Hamas à Gaza, et sera tenu pour l'architecte du 7 **octobre**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 80
        sortie: 93
        ecran: "fiche : Gaza · 2018-2019 · La grande marche du retour"
        source: "commission d'enquête de l'ONU sur les manifestations de 2018 à Gaza, février 2019 : 189 Palestiniens tués du 30 mars au 31 décembre 2018"
        voix: >-
          En 2018, les Gazaouis marchent chaque vendredi vers la clôture : / la « grande marche du retour ». / Cette année-là, 189 Palestiniens sont tués, selon l'**ONU**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 67
        sortie: 80
        ecran: "fiche : Washington · 15 septembre 2020 · Les accords d'Abraham"
        source: "accords d'Abraham, 15 septembre 2020"
        voix: >-
          En 2020, les Émirats et Bahreïn, puis le Maroc et le Soudan, reconnaissent Israël. / Sans attendre d'État palestinien. // La cause palestinienne semble **oubliée**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 105
        sortie: 118
        ecran: "fiche : Gaza · de 2018 à 2023 · L'argent du Qatar"
        source: "M. Mazzetti et R. Bergman, « Buying Quiet », The New York Times, 10 décembre 2023 (15 millions de dollars par mois en espèces en 2018, environ 30 millions par mois en 2021 ; réponse du bureau de Netanyahou : des raisons humanitaires)"
        voix: >-
          Pendant ce temps, Netanyahou laisse le Qatar verser des millions de dollars par mois à Gaza, gouvernée par le Hamas. / Selon le New York Times, il parie qu'un Hamas fort, mais pas trop, / éloignera la pression pour un État **palestinien**.
        note: "« selon le New York Times » : c'est la synthèse de l'enquête, pas un aveu enregistré ; le démenti vient au plan suivant"
      - type: MD
        fichier: output/documents-6.mp4
        entree: 403
        sortie: 419
        ecran: "citation : Benyamin Netanyahou · réunion du Likoud, mars 2019 (propos rapportés)"
        source: "propos rapportés d'une réunion du Likoud, mars 2019 (Maariv ; Haaretz, 9 octobre et 15 novembre 2023 ; Tal Schneider, The Times of Israel, 8 octobre 2023) ; démenti de Netanyahou, entretien avec TIME du 4 août 2024 ; réponse de son bureau au New York Times, décembre 2023"
        voix: >-
          En 2019, la presse israélienne lui prête ces mots : / « Celui qui veut empêcher la création d'un État palestinien / doit soutenir le renforcement du Hamas, et le transfert d'argent au Hamas. » // Il dément l'avoir dit ; / son bureau parle d'aide **humanitaire**.
        note: "règle 6 de la bible : propos rapportés d'une réunion fermée, le démenti est dit dans le même plan"
      - type: MD
        fichier: output/documents-6.mp4
        entree: 419
        sortie: 430
        ecran: "citation : Bezalel Smotrich · chaîne de la Knesset, octobre 2015"
        source: "Bezalel Smotrich, chaîne de la Knesset, octobre 2015 (cité par N12, 5 mai 2026, et Zman Israel, 23 septembre 2026)"
        voix: >-
          Dès 2015, Bezalel Smotrich, aujourd'hui ministre des Finances, le disait à sa façon : / « L'Autorité palestinienne est un fardeau, / et le Hamas est un **atout**. »
      - type: MD
        fichier: output/documents-6.mp4
        entree: 430
        sortie: 443
        ecran: "fiche : Israël · 2022 et 2023 · Le plan « Mur de Jéricho »"
        source: "R. Bergman et A. Goldman, The New York Times, 30 novembre 2023 (document d'une quarantaine de pages, nom de code « Jericho Wall »)"
        verifier: "le document « Jericho Wall », ses auteurs et les alertes de 2023 (question Perplexity, A-FABRIQUER.md)"
        voix: >-
          Et le plan du Hamas, l'armée l'avait. / Plus d'un an avant le 7 octobre, un document d'une quarantaine de pages décrit l'attaque. / Ses chefs le jugent hors de portée du **Hamas**.
      - type: MD
        fichier: output/gaza.mp4
        entree: 30
        sortie: 39
        ecran: "carton : output/cartons/gaza-2023"
        voix: >-
          Le 7 octobre 2023, / le Hamas et d'autres groupes armés attaquent le sud d'**Israël**.
      - type: NOIR
        duree: 18
        source: >-
          environ 1 200 morts en Israël, dont une majorité de civils ; 251 otages ; festival Nova : environ 360 morts ;
          rapport de la représentante spéciale de l'ONU sur les violences sexuelles en conflit, 4 mars 2024
        voix: >-
          Environ mille deux cents morts, / la plupart des civils, / tués chez eux, dans les kibboutz, / et à un
          festival de musique. // 251 otages emmenés à Gaza. / L'ONU documente des violences **sexuelles**. ///
        son: "silence presque total ; aucune musique, aucun effet"
      - type: MD
        fichier: output/gaza.mp4
        entree: 39
        sortie: 50
        source: "Yoav Gallant, ministre de la Défense, 9 octobre 2023 (vidéo) ; cité par la Cour internationale de justice"
        voix: >-
          Le 9 octobre, le ministre de la Défense, Yoav Gallant : / « Ni électricité, ni nourriture, ni carburant. /
          Nous combattons des animaux **humains**. »
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 59
        sortie: 68
        source: "discours de Benyamin Netanyahou, 28 octobre 2023 (Deutéronome 25, 17)"
        voix: >-
          Le 28 octobre, Netanyahou : / « Souviens-toi de ce que t'a fait **Amalek**. »
        note: "dans la Bible, l'ordre qui suit est d'effacer Amalek ; la Cour internationale de justice a relevé la phrase. Ne pas l'expliquer plus : le spectateur comprend."
      - type: MD
        fichier: output/gaza.mp4
        entree: 50
        sortie: 62
        source: "ministère de la Santé de Gaza, bilan du 22 octobre 2026 cité par Europa Press et WAFA (74 498 morts, 175 616 blessés) ; OCHA, 14 octobre 2026 (74 392 morts) ; Z. Jamaluddine et al., The Lancet, 2025"
        voix: >-
          Au 22 octobre 2026, / le ministère de la Santé de Gaza compte plus de soixante-quatorze mille Palestiniens tués, / et plus de cent soixante-quinze mille blessés. / Un décompte sans doute **inférieur** à la réalité.
      - type: MD
        fichier: output/chiffre-gaza.mp4
        entree: 0
        sortie: 12.52
        ecran: "déjà dans la pièce : près de 70 % de femmes et d'enfants parmi les morts vérifiés par l'ONU"
        voix: >-
          Sur les six premiers mois de la guerre, / parmi les morts dont l'ONU a vérifié elle-même l'identité, / près
          de sept sur dix sont des femmes et des **enfants**.
      - type: 3D
        fichier: output/gaza-vue-du-ciel.mp4
        entree: 0
        sortie: 36
        ecran: "déjà dans la pièce : avant et après, images Sentinel-2 de septembre 2023 et septembre 2025"
        voix: >-
          Vu du ciel, avant, / et après. ///
        note: "à étalonner en terre-dure ; laisser l'image parler, la voix seulement au début"
      - type: MD
        fichier: output/gaza.mp4
        entree: 62
        sortie: 73.5
        voix: >-
          Environ neuf habitants sur dix ont été déplacés, souvent plusieurs fois. / En août 2025, la famine est
          **déclarée**.
      - type: MD
        fichier: output/gaza.mp4
        entree: 73.5
        sortie: 84.5
        source: "CIJ, ordonnance du 26 janvier 2024 ; CPI, mandats du 21 novembre 2024 ; commission d'enquête de l'ONU, 16 septembre 2025"
        voix: >-
          La Cour internationale de justice ordonne d'empêcher un génocide. / La CPI émet des mandats d'arrêt contre
          Netanyahou, Gallant, et un chef du **Hamas**.
      - type: NOIR
        duree: 12
        source: "commission internationale indépendante d'enquête de l'ONU, rapport du 16 septembre 2025 ; position du gouvernement israélien"
        voix: >-
          En septembre 2025, une commission d'enquête de l'ONU conclut à un génocide. / Israël rejette ces accusations,
          / et parle de **légitime défense**.
        note: "règle 6 de la bible : la voix dit qui affirme, sur quelle base, et ce qui reste à juger"
      - type: MD
        fichier: output/documents-6.mp4
        entree: 254
        sortie: 269
        ecran: "fiche : Liban, Syrie, Iran · 2024 et 2025 · La guerre s'étend"
        source: "mort de Hassan Nasrallah, 27 septembre 2024 ; chute de Bachar al-Assad, 8 décembre 2024 ; guerre Israël-Iran, 13-24 juin 2025"
        voix: >-
          La guerre déborde. / En septembre 2024, au Liban, Israël tue le chef du Hezbollah, Hassan Nasrallah. / Après la chute d'Assad, son armée avance en Syrie. / En juin 2025, douze jours de guerre avec l'**Iran**.
      - type: MD
        fichier: output/documents.mp4
        entree: 84
        sortie: 99
        source: "Antony Loewenstein, The Palestine Laboratory, Verso, 2023"
        voix: >-
          Le journaliste Antony Loewenstein parle d'un « laboratoire » : / des armes et des outils de surveillance
          utilisés à Gaza et en Cisjordanie, / puis vendus dans le monde comme « éprouvés au **combat** ».
      - type: MD
        fichier: output/documents-6.mp4
        entree: 443
        sortie: 457
        ecran: "fiche : +972 Magazine · 3 avril 2024 · « Lavender »"
        source: "Yuval Abraham, « Lavender », +972 Magazine et Local Call, 3 avril 2024 (six officiers du renseignement) ; réponse de l'armée israélienne"
        verifier: "les chiffres de l'enquête « Lavender » et la réponse de l'armée (question Perplexity, A-FABRIQUER.md)"
        voix: >-
          Le laboratoire, c'est aussi l'intelligence artificielle. / En 2024, six officiers racontent au magazine +972 un programme, « Lavender » : / jusqu'à 37 000 Palestiniens désignés comme cibles. / L'armée dément laisser une machine choisir ses **cibles**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 457
        sortie: 469
        ecran: "fiche : Washington · 4 février 2025 · « La Riviera du Moyen-Orient »"
        source: "conférence de presse de Donald Trump et Benyamin Netanyahou, Maison-Blanche, 4 février 2025"
        verifier: "les mots exacts de Donald Trump le 4 février 2025 (question Perplexity, A-FABRIQUER.md)"
        voix: >-
          En février 2025, à côté de Netanyahou, Donald Trump veut que les États-Unis prennent Gaza, / pour en faire « la Riviera du Moyen-Orient ». / Ses habitants iraient vivre **ailleurs**.
      - type: MD
        fichier: output/documents-6.mp4
        entree: 469
        sortie: 482
        ecran: "fiche : Gaza · mai à juillet 2025 · Tués en cherchant à manger"
        source: "Haut-Commissariat des Nations unies aux droits de l'homme, bilan au 31 juillet 2025 (Palestiniens tués en cherchant de la nourriture depuis le 27 mai 2025) ; Gaza Humanitarian Foundation"
        verifier: "le bilan du HCDH au 31 juillet 2025 (1 373 morts, dont 859 près des sites de la GHF ?) (question Perplexity, A-FABRIQUER.md)"
        voix: >-
          En mai 2025, une fondation soutenue par Israël et les États-Unis prend en main l'aide alimentaire. / En deux mois, selon l'ONU, plus de mille trois cents Palestiniens sont tués en cherchant de quoi **manger**.
      - type: MD
        fichier: output/gaza.mp4
        entree: 84.5
        sortie: 98.5
        source: "cessez-le-feu du 10 octobre 2025 ; ministère de la Santé de Gaza, 22 octobre 2026 (1 538 morts depuis la trêve, série comptée depuis le 11 octobre 2025) ; Reuters, 7 octobre 2026 (Israël contrôle environ les deux tiers de la bande)"
        voix: >-
          10 octobre 2025 : un cessez-le-feu. / Les grandes offensives s'arrêtent, pas les tirs : / au 22 octobre 2026, plus de mille cinq cents morts depuis la trêve. / Israël tient encore environ les deux tiers de la **bande**.
        note: "ne pas additionner les 841 corps retirés des décombres : ce n'est pas la même série"
      - type: MD
        fichier: output/gaza.mp4
        entree: 98.5
        sortie: 107.52
        voix: >-
          Une prison à ciel ouvert, / devenue un champ de **ruines**. ///

  - num: "26"
    titre: "Chapitre 26 · Le sionisme religieux : quand la foi devient programme politique"
    intention: >-
      D'où vient le sionisme religieux (le rabbin Kook, le Goush Emounim), ce qu'il a produit de pire (Hébron 1994),
      et comment il est arrivé au gouvernement. Smotrich et Ben Gvir, par leurs mots et leur casier. Rappeler que
      beaucoup de religieux juifs s'y opposent (chapitre 30).
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-26.mp4
        entree: 0
        sortie: 4.6
      - type: PHOTO
        fichier: output/photos-fixes/1-30-goush-emounim-1978.mp4
        photo: "Wikimedia Commons, « Gush Emunim movement continues to send settlers to illegal settlements… (FL45816230) », Asher Koralik, collection Dan Hadani, Bibliothèque nationale d'Israël, 22 septembre 1978, CC BY 4.0"
        entree: 0
        sortie: 15
        ecran: "déjà dans le plan : 22 septembre 1978 · Mont Huwara, près de Naplouse · Des colons du Goush Emounim lèvent le drapeau sur une colonie non autorisée · Photo d'archive"
        source: "Goush Emounim, fondé en 1974 ; enseignement du rabbin Zvi Yehouda Kook"
        voix: >-
          Après 1967, une partie des Juifs religieux voit dans la conquête un signe de Dieu. / En 1974, ils fondent le
          Goush Emounim, / « le bloc de la foi » : / s'installer partout, en Judée et en **Samarie**.
      - type: NOIR
        duree: 11
        source: "massacre du tombeau des Patriarches, Hébron, 25 février 1994 : 29 morts"
        ecran: "carton : Hébron · 25 février 1994"
        voix: >-
          Le 25 février 1994, à Hébron, / un colon, Baruch Goldstein, tue 29 Palestiniens en prière dans la **mosquée**.
      - type: MD
        fichier: output/figures-aujourdhui.mp4
        entree: 15
        sortie: 20.4
        ecran: "fiche : Smotrich et Ben Gvir, ministres à partir de décembre 2022, tous deux colons"
        voix: >-
          En 2022, ce courant entre au **gouvernement**.
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 68
        sortie: 84
        source: "condamnation de 2007 (incitation au racisme, soutien à une organisation terroriste, le Kach) ; portrait de Baruch Goldstein retiré de son salon en 2020"
        voix: >-
          Itamar Ben Gvir, ministre de la Sécurité nationale. / Condamné en 2007 pour incitation au racisme / et soutien
          à une organisation terroriste. // Chez lui, il a longtemps gardé un portrait de Baruch **Goldstein**.
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 84
        sortie: 97
        source: "entretien à la chaîne 12, 23 août 2023 ; notre traduction"
        voix: >-
          En 2023 : / « Mon droit, celui de ma femme et de mes enfants, / de circuler sur les routes de Judée et de
          Samarie / passe avant la liberté de circulation des **Arabes**. »
      - type: MD
        fichier: output/portraits-3.mp4
        entree: 97
        sortie: 110
        source: "Bezalel Smotrich, 1er mars 2023, après l'attaque de colons contre Huwara ; il retire ensuite ses propos"
        voix: >-
          Bezalel Smotrich, ministre des Finances, / après une attaque de colons contre le village de Huwara : / « Le
          village de Huwara doit être **effacé**. »
        note: "dire qu'il a ensuite retiré ses propos : la voix le fait au plan suivant"
      - type: MD
        fichier: output/documents-6.mp4
        entree: 269
        sortie: 283
