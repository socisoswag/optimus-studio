        ecran: "carton : Janvier 2009 · Gaza · Des obus éclatent au-dessus de la ville."
        note: "vraie image à la place du titre de gaza-guerres (0 à 6) ; les quatre offensives sont dites par la voix et par les fiches suivantes"
        source: "SOURCES.md 4.2, Al Jazeera, rushes « gaza09012009 » (Creative Commons Repository, CC BY 3.0), recadré sans le logo"
        voix: >-
          Puis les offensives, / tous les deux ou trois **ans**.
      - type: ARCH
        fichier: output/plans-reels/gaza-2009-frappe-fumee-noire.mp4
        carton: output/cartons/100-arch-gaza-2009-frappe-fumee-noire.mov
        entree: 0
        sortie: 10
