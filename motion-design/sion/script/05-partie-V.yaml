        voix: >-
          Le 7 octobre 2023, / le Hamas et d'autres groupes armés attaquent le sud d'**Israël**.
      - type: RÉEL
        fichier: output/plans-reels/beeri-maisons-detruites-7-octobre.mp4
        entree: 0
        sortie: 18
        ecran: "carton lieu (à fabriquer) : Be'eri · après le 7 octobre 2023 · des maisons du kibboutz détruites"
        source: >-
