      - type: PHOTO
        fichier: data/archives/05530.jpg
        duree: 13
        source: >-
          SOURCES.md 2.2, Bibliothèque du Congrès, collection Matson, LC-DIG-matpc-05530 (« Plain of Esdraelon,
          telephoto from Nazareth », vers 1900-1920, domaine public) ; faits : mêmes sources que le plan précédent
        ecran: "carton : Nazareth et la plaine · vers 1900-1920 · photo de la colonie américaine (Matson)"
        note: >-
          recadrer : enlever le bord de la plaque de verre et la bande de légende en haut. Lente poussée de Nazareth
          (premier plan) vers la plaine au fond, où se trouve al-Fula. À passer en relief comme archives-vivantes.
        voix: >-
          Ils écrivent à Istanbul : / la vente prive mille villageois de leur **pain**. // Le sous-préfet de Nazareth
          refuse de la signer. / En vain : / en 1911, la colonie de Merhavia s'installe.
        note: >-
          « mille villageois » : chiffre de leur pétition (le dire comme tel). Ne pas dire « tués » ni « massacre » :
          ce sont des expulsions et des heurts, pas plus.
