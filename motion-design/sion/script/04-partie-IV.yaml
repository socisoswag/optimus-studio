        type: ARCH
        note: "Juin 1967 · New York · le Conseil de sécurité des Nations unies pendant la guerre (actualités Universal, domaine public) : avant la résolution 242"
      - fichier: output/archives-filmees/1967-sinai-blindes-israeliens.mp4
        type: ARCH
        note: "Juin 1967 · Sinaï · les blindés israéliens (archives de l'armée israélienne, CC BY-SA 3.0, crédit obligatoire) : copie de petite définition, à poser en plan de coupe sur 19.22 si tu veux, sans couvrir la carte"
    intention: >-
      Le chapitre le plus long de la partie : quatre cartes pour tout comprendre, Suez 1956 et Kafr Qassem, la guerre
      de 1967 racontée avec la lecture israélienne (guerre préventive) puis ses conséquences, et Jérusalem. Le titre dit
      « occupation » : le mot du droit international, plus fort parce qu'incontestable.
