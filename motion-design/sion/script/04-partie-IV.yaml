        fichier: output/chapitres/chapitre-19.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/frontieres.mp4
        entree: 0
        sortie: 10
        voix: >-
          Pour comprendre la suite, / quatre **cartes**.
      - type: MD
        fichier: output/frontieres.mp4
        entree: 10
        sortie: 21
        voix: >-
          En 1949, Israël s'étend sur 78 % de la Palestine mandataire. / Restent la Cisjordanie et **Gaza**.
      - type: MD
        fichier: output/frontieres.mp4
        entree: 21
        sortie: 31
        voix: >-
          En juin 1967, Israël occupe tout le **reste**.
      - type: MD
        fichier: output/frontieres.mp4
        entree: 31
        sortie: 42
        voix: >-
          Aujourd'hui, les zones palestiniennes autonomes et Gaza / font moins d'un dixième de la Palestine
          **mandataire**.
