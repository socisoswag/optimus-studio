titre: "Partie IV · Résistances et oppressions"
intro: >-
  De 1956 aux accords d'Oslo et au mur. Les cartes et les chiffres sont déjà à l'écran : la voix les accompagne sans
  les répéter, et dit ce que l'image ne dit pas (le point de vue de chaque camp, le poids d'un mot). La violence contre
  les civils est nommée des deux côtés : Kafr Qassem, Sabra et Chatila, Munich, les attentats-suicides.
chapitres:
  - num: "IV.0"
    titre: "Ouverture de la partie IV"
    plans:
      - type: MD
        fichier: output/partie-4.mp4
        entree: 0
        sortie: 13.6
        ecran: "Partie IV · Résistances et oppressions"

  - num: "19"
