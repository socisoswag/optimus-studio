      - type: MD
        fichier: output/portraits-1.mp4
        entree: 220
        sortie: 237
        source: >-
          assassiné le 30 juin 1924 à Jérusalem par Avraham Tehomi, membre de la Haganah, qui l'a reconnu en 1985
          (entretien avec Shlomo Nakdimon pour la télévision israélienne)
        ecran: "carton : Jérusalem · 30 juin 1924"
        voix: >-
          À Jérusalem, Jacob Israël de Haan, poète néerlandais devenu juif orthodoxe, / défend la cause antisioniste
          auprès des Britanniques et des dirigeants arabes. // Le 30 juin 1924, il est abattu à la sortie d'une
          synagogue. / Par la **Haganah**.
      - type: MD
        fichier: output/portraits-1.mp4
        entree: 237
        sortie: 250
        source: "Brit Shalom, fondé en 1925 (Arthur Ruppin, Hugo Bergmann, Gershom Scholem) ; Ihoud, 1942 (Judah Magnes, Martin Buber)"
        voix: >-
          En 1925, des intellectuels sionistes fondent Brit Shalom, / « l'alliance de la paix » : / un seul État pour
          deux peuples, à égalité. // Ils restent une petite **minorité**.
        note: "détail fort : Arthur Ruppin, celui qui organise les achats de terres, en est un des fondateurs"
      - type: ARCH
        fichier: output/archives-filmees/1945-deportes-juifs-liberes.mp4
        carton: output/cartons/33-arch-1945-deportes-juifs-liberes.mov
        entree: 0
        sortie: 9.64
        ecran: "carton : avril 1945 · Farsleben, près de Magdebourg · Les rescapés d'un train de déportés juifs, libérés par l'armée américaine"
        source: "US Army Signal Corps, « Freed Jews », catalogué le 17 avril 1945 (train de Farsleben, libéré le 13 avril ; identification de Matthew Rozell), archives nationales américaines 111-ADC-9721 (catalogue 23486)"
        voix: >-
          Puis viendra la Shoah. // Et pour la plupart des survivants, / la question ne se posera plus de la même
          **façon**.

  - num: "11"
    titre: "Chapitre 11 · Congrès sionistes et montée des tensions avec les Arabes palestiniens"
    intention: >-
      La logique du rapport de force, dite par un dirigeant sioniste lui-même : Jabotinsky et le « Mur de fer »
      (1923), un texte d'une franchise rare. Puis les chiffres de l'immigration et de la terre, et le tournant de 1942
      à New York : le mouvement demande toute la Palestine. Finir sur l'ONU, qui ouvre la partie III.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-11.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/chronologie.mp4
        entree: 19.2
        sortie: 23.6
        ecran: "fiche de la chronologie : Zeev Jabotinsky"
      - type: MD
        fichier: output/portraits-1.mp4
        entree: 250
        sortie: 266
        source: >-
          Zeev Jabotinsky, « Le Mur de fer » (O jeleznoï stene), Rassvet, 4 novembre 1923 ; traduction anglaise
          publiée dans The Jewish Herald, 26 novembre 1937 ; notre traduction
        voix: >-
          En 1923, Zeev Jabotinsky écrit « Le Mur de fer ». / Il ne nie pas ce qu'il voit : / « Toute population
          indigène résiste aux colons, / tant qu'elle garde le moindre espoir d'échapper à la **colonisation**. »
      - type: MD
        fichier: output/documents-2.mp4
        entree: 98
        sortie: 111
        ecran: "« derrière un mur de fer, que la population indigène ne pourra pas percer » · Zeev Jabotinsky, 1923"
        voix: >-
          Sa conclusion : / la colonisation ne peut avancer / que « derrière un mur de fer, / que la population
          indigène ne pourra pas **percer** ».
        note: >-
          texte capital pour les deux récits : le récit sioniste y lit le réalisme (on ne négocie qu'en position de
          force), le récit palestinien la preuve d'un projet colonial assumé. La voix ne commente pas.
      - type: MD
        fichier: output/aliyas.mp4
        entree: 17
        sortie: 27.5
        ecran: "déjà dans la pièce : De 1919 à 1929 · environ 120 000 arrivées en dix ans"
        voix: >-
          Les immigrants arrivent par vagues. / Environ cent vingt mille dans les années **vingt**.
      - type: ARCH
        fichier: output/archives-filmees/1938-haifa-paquebot-au-port.mp4
