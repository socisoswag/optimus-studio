  - num: "9"
    titre: "Chapitre 9 · L'accord Haavara et l'assassinat d'Arlosoroff"
    intention: >-
      Le chapitre le plus piégé du film (voir la bible, risque 2). On raconte exactement ce que disent les
      historiens : un accord de transfert qui sauve des vies et des biens, signé avec un régime qui veut chasser les
      Juifs, et qui brise le boycott lancé par des Juifs du monde entier. Puis le meurtre d'Arlosoroff, sans jamais
      désigner un coupable que la justice n'a pas désigné. Finir en désamorçant la récupération antisémite.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-09.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/portraits-1.mp4
        entree: 180
        sortie: 195
        source: "lois antijuives d'avril 1933 (fonction publique le 7 avril, quotas scolaires le 25 avril)"
        voix: >-
          1933. / Hitler prend le pouvoir. / Les Juifs d'Allemagne sont chassés de la fonction publique, / des écoles,
          des métiers. // Un dirigeant sioniste, Haïm Arlosoroff, cherche à les faire **sortir**.
        note: "on dit « Ar-lo-so-rof »"
      - type: MD
        fichier: output/documents-2.mp4
        entree: 53
        sortie: 69
        source: >-
          article « Haavara Agreement » (Wikipedia, d'après Edwin Black, The Transfer Agreement, 1984, et Yehuda
          Bauer, Jews for Sale?, 1994) : environ 60 000 Juifs allemands en Palestine de 1933 à 1939 ; 105 millions
          de reichsmarks de marchandises allemandes exportées
        voix: >-
          En août 1933, un accord est signé avec l'Allemagne nazie : / Haavara, « le transfert » en hébreu. / Les
          Juifs qui partent pour la Palestine sauvent une partie de leurs biens, / sous forme de marchandises
          **allemandes**.
      - type: ARCH
        fichier: output/archives-filmees/1938-tel-aviv-rues.mp4
        carton: output/cartons/62-arch-1938-tel-aviv-rues.mov
        entree: 0
        sortie: 13
        ecran: "carton : 1938 · Tel-Aviv · Les rues commerçantes."
        source: "SOURCES.md 4.2, March of Time, rushes de 1938 (NARA 200 MTT 666 F ; date de la notice USHMM irn1001006)"
        voix: >-
          Environ soixante mille Juifs allemands gagnent ainsi la Palestine avant la guerre. // Mais l'accord brise le
          boycott des produits allemands, / lancé par des Juifs du monde **entier**.
      - type: MD
        fichier: output/portraits-1.mp4
        entree: 195
        sortie: 203
        voix: >-
          La droite sioniste, autour de Zeev Jabotinsky, / crie à la **trahison**.
      - type: MD
        fichier: output/portraits-1.mp4
        entree: 203
        sortie: 220
        source: >-
          procès de 1934 (Stavsky condamné puis acquitté en appel, faute de preuve qui corrobore) ; commission
