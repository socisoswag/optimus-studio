        son: "mer la nuit, un seul coup sec très lointain, puis la mer seule"
      - type: MD
        fichier: output/paroles.mp4
        entree: 5
        sortie: 19
        ecran: "mots : Un accord repris par des antisémites, puis : Un sauvetage arraché au régime nazi"
