        ecran: "carton : Tel-Aviv · 16 juin 1933"
        voix: >-
          Le 16 juin 1933, Arlosoroff est tué par balles sur la plage de Tel-Aviv. / Deux militants de cette droite
          sont accusés, / puis acquittés. // En 1985, une commission israélienne les lave de tout soupçon. / Les
