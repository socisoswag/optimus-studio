        source: "ventes Sursock, plaine de Jezréel, années 1920 ; chiffres présentés autour de la commission Shaw, 1930 (environ 240 000 dounams, 1 746 familles), discutés par les historiens"
        voix: >-
          Sous le mandat, les ventes changent d'échelle. / Dans les années 1920, la famille Sursock vend une grande partie de la plaine de Jezréel. / Selon les chiffres cités en 1930, plus de mille sept cents familles de métayers doivent **partir**.
      - type: ARCH
        fichier: output/archives-filmees/1938-colonie-juive-et-tracteur.mp4
        carton: output/cartons/60-arch-1938-colonie-juive-et-tracteur.mov
        entree: 0
        sortie: 11.16
        ecran: "carton : 1938 · Palestine mandataire · Une colonie juive, un tracteur qui défriche."
        source: "SOURCES.md 4.2, March of Time, rushes de 1938 (NARA 200 MTT 666 T), cédés sans restriction aux États-Unis ; migrations rurales vers Haïfa et recrutement d'Izz ad-Din al-Qassam dans les milieux populaires (PalQuest ; Mark Sanagan, Lightning through the Clouds, 2020)"
        photo: "Bibliothèque du Congrès, collection Matson, domaine public (no known restrictions), LC-DIG-matpc-15225, « The Keren Hayesod. Agricultural colonies on Plain of Esdraelon \"The Emek.\" Tractor disc plowing », vers 1920-1933"
        voix: >-
          Sur ces terres naissent des colonies juives. / Des paysans sans terre partent vers Haïfa et ses quartiers pauvres. // C'est là que recrutera Izz ad-Din al-**Qassam**.
      - type: MD
        fichier: output/documents-7.mp4
        entree: 70
        sortie: 85
        ecran: "fiche : Londres · octobre 1930 · Le rapport Hope Simpson"
        source: "Sir John Hope Simpson, rapport du 22 août 1930, publié en octobre (Cmd. 3686) : 29,4 % des familles de 104 villages sans terre ; lettre de Ramsay MacDonald à Chaim Weizmann, 13 février 1931"
        voix: >-
          En 1930, un enquêteur britannique, John Hope Simpson, étudie 104 villages : / 29,4 % des familles n'y possèdent pas de terre. / Londres promet de freiner les achats, / puis recule l'année suivante, sous la pression du mouvement **sioniste**.
      - type: MD
        fichier: output/portraits-1.mp4
        entree: 166
        sortie: 180
        voix: >-
          En 1935, un prédicateur de Haïfa, / Izz ad-Din al-Qassam, / prend les armes contre les Britanniques. / Il
          est tué en novembre. // La branche armée du Hamas porte aujourd'hui son **nom**.
      - type: IA
        fichier: output/reconstitutions/11-19-manifestation-jaffa-1933.mp4
        entree: 0
        sortie: 8.0
        source: "SOURCES.md 2.2 et 4 (Google Veo, d'après matpc 15788, manifestation de Jaffa, octobre 1933)"
        ecran: "déjà dans le plan : Octobre 1933 · Jaffa · La foule des manifestants face à la police britannique · Photo d'archive animée par IA"
        voix: >-
          1933. / Hitler arrive au pouvoir, / l'immigration juive s'accélère, / et Jaffa **manifeste**.
      - type: IA
        fichier: output/reconstitutions/12-20-greve-1936-souk-desert.mp4
