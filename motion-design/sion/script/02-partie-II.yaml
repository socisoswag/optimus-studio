  - num: "10"
    titre: "Chapitre 10 · Les Juifs face au sionisme : le grand débat"
    reserve:
      - fichier: output/reconstitutions/14-23-mur-occidental.mp4
        type: IA
        note: "La prière au mur occidental (reconstitution d'après la photo matpc 04802, SOURCES.md 2.2) : remplacée en 10.4 par le vrai film de 1933"
    intention: >-
      Avant 1948, le sionisme est loin de faire l'unanimité chez les Juifs : réformés américains, ouvriers du Bund,
      rabbins orthodoxes, sionistes partisans d'un État pour deux peuples. Un fait dur (l'assassinat de de Haan par
      la Haganah) montre que ce débat n'était pas seulement intellectuel. Les voix d'aujourd'hui viendront dans la
      partie VI.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-10.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/documents-2.mp4
        entree: 82
        sortie: 98
        source: "déclaration de Pittsburgh, conférence des rabbins réformés, 16-19 novembre 1885, article 5 ; notre traduction"
        ecran: "« Nous ne nous considérons plus comme une nation, mais comme une communauté religieuse. » · Pittsburgh, 1885"
        voix: >-
          Au début, le sionisme est minoritaire chez les Juifs. / En 1885, aux États-Unis, les rabbins réformés
          déclarent : / « Nous ne nous considérons plus comme une nation, mais comme une communauté religieuse, / et
          n'attendons donc pas de retour en **Palestine**. »
      - type: IA
        fichier: output/reconstitutions/15-28-bund-1917.mp4
        entree: 0
        sortie: 15
        ecran: "déjà dans le plan : 1917 · Empire russe · Une manifestation du Bund · Photo d'archive animée par IA"
        photo: "Wikimedia Commons, « Bundist demonstration », auteur inconnu, février-mars 1917, domaine public"
        source: "Bund (Union générale des travailleurs juifs), fondé à Vilnius en octobre 1897"
        voix: >-
          En 1897, l'année même du congrès de Bâle, / des ouvriers juifs fondent le Bund, à Vilnius. / Leur idée :
          rester, et se battre là où l'on vit. // En yiddish : doikayt, « **l'ici** ».
      - type: ARCH
        fichier: output/archives-filmees/1933-jerusalem-mur-occidental.mp4
        carton: output/cartons/32-arch-1933-jerusalem-mur-occidental.mov
        entree: 0
        sortie: 14.56
        ecran: "carton : 1933 · Jérusalem · Au mur occidental (film amateur)"
        source: "film amateur de la famille Levy, 1933, Prelinger Archives (archive.org, Levycoll1933), domaine public ; Agoudat Israël, fondé à Katowice en 1912"
        voix: >-
          Pour beaucoup de rabbins orthodoxes, le sionisme est une faute : / seul le Messie doit ramener les Juifs sur
