titre: "Partie II · Le basculement"
intro: >-
  De la promesse de 1917 à la veille du partage. Trente ans où tout se noue : trois promesses contradictoires, un
  mandat britannique qui ne consulte pas la majorité, des violences contre les civils des deux côtés, l'Allemagne
  nazie, et des Juifs qui se divisent sur le sionisme lui-même. Le ton reste le même : les faits d'abord, chaque camp
  avec ses propres mots.
chapitres:
  - num: "II.0"
    titre: "Ouverture de la partie II"
    plans:
      - type: MD
        fichier: output/partie-2.mp4
        entree: 0
        sortie: 14.6
        ecran: "Partie II · Le basculement"
        son: "bande-son de la pièce"

  - num: "7"
    titre: "Chapitre 7 · La déclaration Balfour (1917)"
    intention: >-
      Trois promesses en deux ans, et la phrase de Balfour lue en entier, y compris ce qu'elle ne dit pas : les
      « collectivités non juives » sont neuf habitants sur dix, et leurs droits politiques n'y figurent pas. Le point
      de vue sioniste a sa place (une grande puissance reconnaît enfin le lien du peuple juif à cette terre), comme
      le seul ministre juif du gouvernement, qui s'y oppose. Finir sur la note de Balfour de 1919 : la preuve, de sa
      main, que les habitants ne seront pas consultés.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-07.mp4
        entree: 0
        sortie: 4.6
      - type: MD
        fichier: output/trois-promesses.mp4
        entree: 0
        sortie: 6
        ecran: "Première Guerre mondiale · de 1915 à 1917 · Trois engagements britanniques, en deux ans"
        voix: >-
          1915. / Pour abattre l'Empire ottoman, / Londres fait trois **promesses**.
      - type: MD
        fichier: output/trois-promesses.mp4
        entree: 6
        sortie: 18.5
        source: "SOURCES.md 6 (lettre de McMahon à Hussein, 24 octobre 1915)"
        ecran: "Le Caire · 24 octobre 1915 · Correspondance Hussein-McMahon"
        voix: >-
          Aux Arabes d'abord. / S'ils se soulèvent contre les Ottomans, / la Grande-Bretagne soutiendra leur
          **indépendance**. // C'est la lettre de Henry McMahon au chérif Hussein de La Mecque.
      - type: MD
        fichier: output/trois-promesses.mp4
        entree: 18.5
        sortie: 31
        source: "SOURCES.md 6 (accords Sykes-Picot, 16 mai 1916)"
        ecran: "Londres · 16 mai 1916 · secret · Accords Sykes-Picot"
        voix: >-
          En même temps, en secret, / Londres et Paris se partagent déjà la région : / c'est l'accord Sykes-Picot.
          // La Palestine doit devenir une zone **internationale**.
      - type: MD
        fichier: output/sykes-picot.mp4
        entree: 0
        sortie: 10
        ecran: "déjà dans le plan : la vraie carte de 1916 posée sur le relief (bleu, rouge, A, B, jaune)"
        source: "carte signée par Mark Sykes et François Georges-Picot, 8 mai 1916, The National Archives (Royaume-Uni), MPK 1/426, domaine public ; accord Sykes-Picot, lettres du 9 au 16 mai 1916"
        voix: >-
          Sur la carte signée en mai 1916, / la France prend le bleu, / le Royaume-Uni le **rouge**.
      - type: MD
        fichier: output/sykes-picot.mp4
        entree: 10
        sortie: 19
        ecran: "déjà dans le plan : la zone jaune, administration internationale ; Haïfa et Acre au Royaume-Uni"
        source: "carte signée par Mark Sykes et François Georges-Picot, 8 mai 1916, The National Archives (Royaume-Uni), MPK 1/426, domaine public ; accord Sykes-Picot, lettres du 9 au 16 mai 1916"
        voix: >-
          La Palestine, en jaune, / doit passer sous une administration **internationale**.
      - type: MD
        fichier: output/trois-promesses.mp4
        entree: 31
        sortie: 44
        source: "SOURCES.md 6 (déclaration Balfour, 2 novembre 1917)"
        ecran: "Londres · 2 novembre 1917 · Déclaration Balfour"
        voix: >-
          Et le 2 novembre 1917, / le ministre Arthur Balfour écrit à Lord Rothschild : / Londres « envisage
          favorablement » / un foyer national pour le peuple juif en **Palestine**.
      - type: MD
        fichier: output/documents.mp4
        entree: 23
        sortie: 38
        source: >-
          texte de la déclaration ; population : Justin McCarthy, 1990, tableau 2.3 (1918 : 58 728 juifs sur
          748 128 habitants, soit 8 %)
        ecran: "la caméra glisse sur la lettre, jusqu'à « the civil and religious rights of existing non-Jewish communities »"
        voix: >-
          Une phrase protège « les droits civils et religieux » / des « collectivités non juives ». // Elles forment
          alors neuf habitants sur **dix**. / Leurs droits politiques ne sont pas cités.
        son: "papier, horloge lointaine, salle de ministère"
      - type: MD
        fichier: output/portraits-1.mp4
        entree: 125
        sortie: 137
        voix: >-
          Pour les sionistes, c'est une victoire immense. / Pour la première fois, une grande puissance reconnaît le
          lien du peuple juif avec cette **terre**.
      - type: MD
        fichier: output/chronologie.mp4
        entree: 10.4
        sortie: 14.8
        ecran: "fiche de la chronologie : Chaïm Weizmann"
        voix: >-
          Chaïm Weizmann l'a obtenue / après des mois de **démarches**.
      - type: MD
        fichier: output/portraits-1.mp4
        entree: 137
        sortie: 150
        source: >-
          Edwin Montagu, « Memorandum on the Anti-Semitism of the Present Government », note au cabinet britannique,
          23 août 1917, mémorandum G.T. 1868 (The National Archives, Kew, CAB 24/24/71) ; notre traduction
        ecran: "Edwin Montagu · secrétaire d'État pour l'Inde · seul ministre juif du gouvernement"
        voix: >-
          Un seul ministre juif siège au gouvernement : / Edwin Montagu. // Il s'y oppose. / Le sionisme, écrit-il,
          est « une doctrine politique **nuisible** ».
        note: >-
          Montagu juge la déclaration antisémite : elle ferait des Juifs anglais des étrangers dans leur pays. C'est
          la preuve que Juifs et sionisme ne sont pas la même chose (règle 2 de la bible).
      - type: MD
        fichier: output/documents-2.mp4
        entree: 0
        sortie: 19
        source: >-
          Arthur Balfour, mémorandum du 11 août 1919, Documents on British Foreign Policy 1919-1939, première série,
          vol. IV, p. 345 ; notre traduction
        ecran: >-
          « En Palestine, nous ne proposons même pas de consulter les habitants actuels du pays. » · Arthur Balfour,
          11 août 1919
        voix: >-
          Deux ans plus tard, Balfour l'écrit sans détour, dans une note interne : / « En Palestine, nous ne
          proposons même pas de consulter les habitants actuels du pays. » // Le sionisme, ajoute-t-il, compte plus
          que « les désirs et les préjugés / de 700 000 **Arabes** ».
        son: "salle vide, une seule respiration du papier"
      - type: MD
        fichier: output/trois-promesses.mp4
        entree: 44
        sortie: 54.5
        source: "SOURCES.md 6 (Arthur Koestler, Promise and Fulfilment, 1949)"
        ecran: "« Une nation promettait solennellement à une deuxième le pays d'une troisième. »"
        voix: >-
          Arthur Koestler, longtemps sioniste, résumera : // « Une nation promettait solennellement à une deuxième /
          le pays d'une **troisième**. » ///

  - num: "8"
    titre: "Chapitre 8 · Le mandat britannique : trente ans sous tension"
    reserve:
      - fichier: output/reconstitutions/8-09b-nebi-musa-drapeaux.mp4
        note: "les bannières de Nebi Musa arrivent à al-Aqsa, 1918 (la vraie photo, puis la reconstitution par IA) : pour prolonger le plan 8.7"
      - fichier: output/reconstitutions/13-21-maison-dynamitee-lydda-1936.mp4
        type: IA
        note: "1936 · Lydda · Maison dynamitée par l'armée britannique · Photo d'archive animée par IA (avant au plan 8.17, remplacée par le vrai convoi de 1938 ; à reprendre si tu la préfères)"
    intention: >-
      Trente ans en trois minutes. Un pouvoir étranger qui refuse un gouvernement élu (la majorité aurait dit non),
      les violences de 1920, 1921 et 1929 avec leurs morts juifs et arabes, Hébron, la révolte de 1936 et sa
      répression, les bombes de l'Irgoun et le massacre de Tibériade, puis le livre blanc de 1939 qui ferme la porte
      au moment où les Juifs d'Europe cherchent à fuir. Le mufti est montré tel qu'il fut, y compris son alliance
      avec Hitler : le cacher ruinerait tout le reste.
    plans:
      - type: CARTON
        fichier: output/chapitres/chapitre-08.mp4
        entree: 0
        sortie: 4.6
      - type: IA
        fichier: output/reconstitutions/6-08-entree-britanniques-1917.mp4
        entree: 0
        sortie: 10
        source: "SOURCES.md 2.2 et 4 (Google Veo, d'après matpc 02225, entrée du maréchal Allenby, porte de Jaffa, 11 décembre 1917)"
        ecran: "carton : output/cartons/jerusalem-1917 · mention obligatoire : Reconstitution par IA, d'après une photo d'archive"
        voix: >-
          Le 11 décembre 1917, le général Allenby entre à pied dans Jérusalem. / Pour trente ans, la Palestine sera
          **britannique**.
        son: "pas de troupe, foule, cloches lointaines"
      - type: ARCH
        fichier: output/archives-filmees/1930-paths-to-palestine-02.mp4
        carton: output/cartons/31-arch-1930-paths-to-palestine-02.mov
        entree: 0
        sortie: 13.48
        source: "SOURCES.md 4.2 (« Paths in Palestine », 1934, NARA 2767364 ; producteur et statut du droit d'auteur non établis)"
        ecran: "carton : Jérusalem · 1934"
        voix: >-
          En 1922, la Société des Nations confie la Palestine à Londres. / Le mandat reprend la promesse Balfour, /
          et demande de faciliter l'immigration **juive**.
        note: "préambule du mandat (texte de la déclaration) et article 6 (immigration, installation sur les terres)"
      - type: ARCH
        fichier: output/archives-filmees/1930-paths-to-palestine-05.mp4
        entree: 0
        sortie: 11.6
        source: "SOURCES.md 4.2 (« Paths in Palestine », 1934)"
        voix: >-
          Les Arabes de Palestine réclament un gouvernement élu. / Londres ne l'accordera jamais : / une majorité
          arabe aurait fermé la porte au foyer **juif**.
      - type: MD
        fichier: output/chronologie.mp4
        entree: 14.8
        sortie: 19.2
        ecran: "fiche de la chronologie : Amin al-Husseini"
        voix: >-
          En 1921, Londres nomme un grand **mufti**.
      - type: MD
        fichier: output/portraits-1.mp4
        entree: 150
        sortie: 166
        source: "faits biographiques (SOURCES.md 5, chronologie) ; rencontre avec Hitler à Berlin, 28 novembre 1941"
        voix: >-
          Amin al-Husseini, un jeune notable de Jérusalem, / deviendra le chef du mouvement national palestinien. //
          Pendant la Seconde Guerre mondiale, / il s'alliera à l'Allemagne nazie, / et rencontrera Hitler à
          **Berlin**.
        note: >-
          à dire sans adjectif : le fait suffit. Le récit israélien en fait le visage du nationalisme palestinien ;
          le film montre aussi, plus loin, les autres voix palestiniennes.
      - type: IA
        fichier: output/reconstitutions/7-09-nebi-musa.mp4
        entree: 0
        sortie: 9.2
        note: "la procession de Nebi Musa : les émeutes d'avril 1920 éclatent pendant cette fête ; la légende (date, lieu) est déjà dans l'image, poser les bilans plus haut"
        source: >-
          SOURCES.md 2.2 et 4 (Google Veo, d'après matpc 01218, la procession de Nebi Musa) ; bilans : rapports britanniques (commission Palin 1920, commission
          Haycraft 1921, commission Shaw 1930)
        ecran: "Jérusalem, avril 1920 · 5 Juifs et 4 Arabes tués · Jaffa, mai 1921 · 47 Juifs et 48 Arabes tués"
        voix: >-
          La colère monte. / Avril 1920, à Jérusalem : / cinq Juifs et quatre Arabes tués. / Mai 1921, à Jaffa : /
          près de cent **morts**.
      - type: ARCH
        fichier: output/archives-filmees/1930-paths-to-palestine-12.mp4
        entree: 0
        sortie: 9.92
        source: "SOURCES.md 4.2 ; bilan d'août 1929 : commission Shaw, 1930"
        ecran: "Août 1929 · 133 Juifs tués · 116 Arabes tués, surtout par la police britannique"
        voix: >-
          Août 1929. / Une querelle autour du mur des Lamentations. / Des émeutiers arabes tuent 133 **Juifs**. / La
          police britannique tue 116 Arabes.
      - type: MD
        fichier: output/documents.mp4
        entree: 140
        sortie: 152
        source: "commission Shaw, 1930 ; 1929 Hebron massacre (Wikipedia, pour les références)"
        ecran: "Hébron · 24 août 1929 · Le massacre d'Hébron · 67 Juifs tués · des familles cachées chez leurs voisins arabes"
        voix: >-
          À Hébron, 67 Juifs sont massacrés, / dans une ville où leur communauté vivait depuis des **siècles**. //
          Des familles arabes en cachent d'autres chez elles.
        note: "le nombre de Juifs cachés par des voisins arabes est débattu : ne pas donner de chiffre"
        son: "silence presque complet, un vent sec"
      - type: MD
        fichier: output/chronologie.mp4
        entree: 23.6
        sortie: 28
        ecran: "fiche de la chronologie : Izz ad-Din al-Qassam"
      - type: MD
        fichier: output/documents-7.mp4
        entree: 56
        sortie: 70
